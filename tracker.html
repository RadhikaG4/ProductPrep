<title>ProductPrep Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a working desk. Header with live progress and a theme switch, sticky tabs, one working column. Graphite neutrals with a single violet accent. */
:root {
  --bg: #f6f6f4;
  --surface: #ffffff;
  --ink: #18181b;
  --muted: #62626b;
  --line: #e3e3e0;
  --accent: #5b4bdb;
  --accent-ink: #ffffff;
  --accent-soft: #eeecfd;
  --good: #1f7a4d;
  --good-soft: #e2f2e9;
  --warn: #a8551a;
  --warn-soft: #f8ebdf;
  --star: #d99a00;
  --s-design: #5b4bdb; --s-rca: #c0392b; --s-guess: #1f7a4d; --s-improve: #8e44ad; --s-metrics: #9a6b00; --s-pricing: #11788a; --s-gtm: #b35415; --s-strategy: #4a5068;
  --f-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111113; --surface: #1a1a1d; --ink: #ececef; --muted: #9a9aa3; --line: #2d2d33;
    --accent: #a99bff; --accent-ink: #15131f; --accent-soft: #262240; --good: #5cc98f; --good-soft: #16291f;
    --warn: #eaa06b; --warn-soft: #35241a; --star: #f0c040;
    --s-design: #a99bff; --s-rca: #ff8a7a; --s-guess: #5cc98f; --s-improve: #d09bf0; --s-metrics: #f0c040; --s-pricing: #6fd3de; --s-gtm: #f0a070; --s-strategy: #b8bdd4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111113; --surface: #1a1a1d; --ink: #ececef; --muted: #9a9aa3; --line: #2d2d33;
  --accent: #a99bff; --accent-ink: #15131f; --accent-soft: #262240; --good: #5cc98f; --good-soft: #16291f;
  --warn: #eaa06b; --warn-soft: #35241a; --star: #f0c040;
  --s-design: #a99bff; --s-rca: #ff8a7a; --s-guess: #5cc98f; --s-improve: #d09bf0; --s-metrics: #f0c040; --s-pricing: #6fd3de; --s-gtm: #f0a070; --s-strategy: #b8bdd4;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; }
h1, h2, h3, h4 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.2; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { padding-block: 26px 16px; }
.toprow { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
header.top h1 { font-size: clamp(28px, 5vw, 40px); font-weight: 700; margin-top: 6px; }
header.top p.lede { color: var(--muted); max-width: 66ch; margin: 8px 0 0; }
.theme-btn { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13px; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.theme-btn .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--ink); box-shadow: inset -4px -2px 0 0 var(--surface); }
.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-top: 20px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.stat .k { font-size: 11px; color: var(--muted); font-family: var(--f-mono); letter-spacing: .04em; text-transform: uppercase; }
.stat .v { font-family: var(--f-display); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 13px; color: var(--muted); font-weight: 500; }
.stat .s { font-size: 12px; color: var(--muted); margin-top: 4px; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 6px; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s; }
.stat input[type=date] { font: inherit; font-size: 13px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; margin-top: 4px; max-width: 100%; }
.sync { font-family: var(--f-mono); font-size: 11px; color: var(--muted); margin-top: 10px; }

nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
nav.tabs .wrap { display: flex; gap: 2px; overflow-x: auto; }
nav.tabs button { background: none; border: 0; padding: 12px 12px; cursor: pointer; font-family: var(--f-display); font-weight: 600; font-size: 15px; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
nav.tabs button[aria-selected=true] { color: var(--ink); border-bottom-color: var(--accent); }

main { padding-block: 22px 60px; }
.section-head { margin-bottom: 14px; }
.section-head h2 { font-size: 24px; }
.section-head p { color: var(--muted); margin: 6px 0 0; max-width: 78ch; }
.phase { margin-top: 26px; }
.phase:first-child { margin-top: 0; }
.phase > h3, .kicker { font-size: 13px; font-family: var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; margin-bottom: 10px; }

details.day { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; }
details.day.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
details.day > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 14px; align-items: center; }
details.day > summary::-webkit-details-marker { display: none; }
.daynum { font-family: var(--f-display); font-weight: 700; font-size: 22px; width: 44px; height: 44px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-variant-numeric: tabular-nums; }
details.day.complete .daynum { background: var(--good-soft); color: var(--good); }
.daytitle { min-width: 0; }
.daytitle h3 { font-size: 18px; }
.daytitle .meta { font-size: 13px; color: var(--muted); }
.pill { font-family: var(--f-mono); font-size: 12px; padding: 3px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill.today { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pill.done { background: var(--good-soft); border-color: transparent; color: var(--good); }
.daybody { padding: 0 16px 16px; display: grid; gap: 14px; }
.daybody .focus { color: var(--muted); margin: 0; max-width: 78ch; }
.block h4 { font-family: var(--f-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; margin: 0 0 6px; }
.tip { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; font-size: 14px; }

.row { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 10px; align-items: start; padding: 9px 0; border-top: 1px solid var(--line); }
.block .row:first-of-type, .cat .row:first-of-type, .card .row:first-of-type { border-top: 0; }
.check { appearance: none; width: 20px; height: 20px; border: 2px solid var(--muted); border-radius: 5px; margin: 2px 0 0; cursor: pointer; display: grid; place-items: center; background: var(--surface); flex: none; }
.check:checked { background: var(--good); border-color: var(--good); }
.check:checked::after { content: ""; width: 5px; height: 10px; border: solid var(--surface); border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px); }
.row .txt { min-width: 0; }
.row.is-done .txt > .q { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.row .q { font-weight: 500; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; align-items: center; }
.tag { font-family: var(--f-mono); font-size: 11px; padding: 1px 7px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.tag.plain { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.tag.rep { background: var(--good-soft); color: var(--good); }
.tag.gd { background: var(--warn-soft); color: var(--warn); }
.tag.co { background: var(--ink); color: var(--bg); }
.tag.src-dc { background: color-mix(in srgb, var(--s-improve) 15%, transparent); color: var(--s-improve); }
.tag.src-iima, .tag.src-sigma, .tag.src-primer { background: color-mix(in srgb, var(--s-pricing) 15%, transparent); color: var(--s-pricing); }
.tag.src-exponent { background: color-mix(in srgb, var(--s-gtm) 15%, transparent); color: var(--s-gtm); }
.tag.src-apps { background: color-mix(in srgb, var(--s-guess) 15%, transparent); color: var(--s-guess); }
.srcl { font-size: 12px; color: var(--muted); }
.actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
.icon-btn { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; font-size: 12px; cursor: pointer; color: var(--muted); white-space: nowrap; text-decoration: none; display: inline-block; }
.icon-btn:hover { color: var(--ink); border-color: var(--muted); }
.icon-btn[aria-pressed=true] { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); font-weight: 600; }
.icon-btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.more { margin-top: 8px; display: grid; gap: 8px; }
.hint { font-size: 14px; background: var(--bg); border-left: 3px solid var(--accent); padding: 8px 10px; border-radius: 0 6px 6px 0; }
textarea.note, textarea.io { width: 100%; min-height: 70px; font: inherit; font-size: 14px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 8px; resize: vertical; }
textarea.io { font-family: var(--f-mono); font-size: 12px; min-height: 90px; }

.rate { display: inline-flex; gap: 0; align-items: center; }
.rate button { background: none; border: 0; padding: 0 1px; font-size: 17px; line-height: 1; cursor: pointer; color: var(--line); }
.rate button.on { color: var(--star); }
.rate button:hover { transform: scale(1.12); }
.rate .lbl { font-family: var(--f-mono); font-size: 11px; color: var(--muted); margin-right: 4px; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
.chip { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
.chip[aria-pressed=true] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .n { font-family: var(--f-mono); font-size: 11px; opacity: .7; margin-left: 4px; }
input.search { font: inherit; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; flex: 1 1 220px; }
select.sel { font: inherit; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; max-width: 100%; }
.cat, .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 6px; margin-bottom: 14px; }
.cat > header, .card > header { margin-bottom: 4px; }
.cat > header h3, .card > header h3 { font-size: 19px; }
.cat > header p, .card > header p { margin: 2px 0 0; color: var(--muted); font-size: 14px; max-width: 76ch; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 13px; color: var(--muted); margin-bottom: 14px; align-items: center; }

.co-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; margin-bottom: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
.panel h3 { font-size: 18px; margin-bottom: 6px; }
.panel ol, .panel ul { margin: 6px 0 0; padding-left: 20px; font-size: 14px; }
.panel li { margin: 3px 0; }
.panel p { font-size: 14px; margin: 6px 0 0; }
.cotabs { display: flex; gap: 8px; margin-bottom: 14px; }
.cotabs button { font-family: var(--f-display); font-weight: 700; font-size: 18px; padding: 8px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.cotabs button[aria-pressed=true] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.today-head { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 14px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 16px; align-items: center; }
.today-head h2 { font-size: 26px; }
.today-head .meta { color: var(--muted); font-size: 14px; margin-top: 4px; }
.ring { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--line) 0); }
.ring span { width: 60px; height: 60px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; }
.carry-day { font-family: var(--f-mono); font-size: 12px; color: var(--muted); margin: 10px 0 2px; text-transform: uppercase; letter-spacing: .06em; }

.cbgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.case { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 7px; align-content: start; min-width: 0; }
.case.is-done { border-color: var(--good); }
.case .top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.case .seg { font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; padding: 2px 7px; border-radius: 4px; font-weight: 500; color: var(--sc); background: color-mix(in srgb, var(--sc) 14%, transparent); }
.case h4 { font-size: 16px; }
.case h4 a { color: var(--ink); text-decoration: none; }
.case h4 a:hover { color: var(--accent); text-decoration: underline; }
.case .prompt { font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.case .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); font-family: var(--f-mono); }
.case .ctl { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 8px; }
.case .ctl label { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); cursor: pointer; }
.seg-design { --sc: var(--s-design); } .seg-rca { --sc: var(--s-rca); } .seg-guess { --sc: var(--s-guess); } .seg-improve { --sc: var(--s-improve); }
.seg-metrics { --sc: var(--s-metrics); } .seg-pricing { --sc: var(--s-pricing); } .seg-gtm { --sc: var(--s-gtm); } .seg-strategy { --sc: var(--s-strategy); }
.readlist { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.readlist a { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px; color: var(--ink); text-decoration: none; }
.readlist a:hover { border-color: var(--accent); }
.readlist a span { font-family: var(--f-mono); font-size: 11px; color: var(--muted); margin-left: 6px; }
.okmsg { color: var(--good); font-size: 13px; }
.errmsg { color: var(--warn); font-size: 13px; }
@media (max-width: 860px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .co-grid { grid-template-columns: minmax(0,1fr); }
  .row { grid-template-columns: auto minmax(0,1fr); }
  .row .actions { grid-column: 2; justify-content: flex-start; }
}
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } .rate button:hover { transform: none; } }
</style>

<header class="top wrap">
  <div class="toprow">
    <div class="eyebrow">APM / PM-1 interview prep · Juspay &amp; Swiggy focus</div>
    <button class="theme-btn" id="themeBtn" type="button"><span class="dot" aria-hidden="true"></span><span id="themeLbl">Dark mode</span></button>
  </div>
  <h1>ProductPrep Tracker</h1>
  <p class="lede">Real questions candidates reported, the IIMA and IIMB (Sigma) casebooks one click away, and a 10-day plan that ties them together. Tick, rate and take notes as you go.</p>
  <div class="stats" id="stats"></div>
  <div class="sync" id="sync">Saving on this device</div>
</header>

<nav class="tabs" aria-label="Sections">
  <div class="wrap" role="tablist">
    <button role="tab" data-tab="today" aria-selected="true">Today</button>
    <button role="tab" data-tab="plan" aria-selected="false">Schedule</button>
    <button role="tab" data-tab="bank" aria-selected="false">Real questions</button>
    <button role="tab" data-tab="focus" aria-selected="false">Juspay &amp; Swiggy</button>
    <button role="tab" data-tab="cases" aria-selected="false">Casebooks</button>
    <button role="tab" data-tab="concepts" aria-selected="false">Concepts</button>
    <button role="tab" data-tab="sources" aria-selected="false">Sources</button>
  </div>
</nav>

<main class="wrap" id="main"></main>

<script>
/* ============ Sources ============ */
const SRC = {
  gd_jp_apm: ["Glassdoor: Juspay APM interviews", "https://www.glassdoor.co.in/Interview/JUSPAY-Associate-Product-Manager-Interview-Questions-EI_IE1102352.0,6_KO7,32.htm"],
  gd_jp_pm: ["Glassdoor: Juspay PM interviews", "https://www.glassdoor.co.in/Interview/JUSPAY-Product-Manager-Interview-Questions-EI_IE1102352.0,6_KO7,22.htm"],
  gd_jp_pta: ["Glassdoor: Juspay Product Technical Analyst", "https://www.glassdoor.com/Interview/JUSPAY-Product-Technical-Analyst-Interview-Questions-EI_IE1102352.0,6_KO7,32.htm"],
  gv_jp: ["Grapevine: Product Manager interview @ Juspay", "https://www.grapevine.in/post/product-manager-interview-juspay-48f500ce-f7d4-4eeb-bd2e-e82d7d2d3db3"],
  gv_jp_code: ["Grapevine: Juspay product interviews had a coding round", "https://www.grapevine.in/post/juspay-product-interviews-had-a-coding-round-c9997524-481d-427c-88c7-00cd48cbdb34"],
  bi_jp: ["Board Infinity: Juspay PM interview guide", "https://discuss.boardinfinity.com/t/juspay-product-manager-interview-questions-experience-guide/23345"],
  salt_jp: ["The Product Salt: Juspay APM case study (Scribd)", "https://www.scribd.com/document/819192622/JUSPAY-Case-Study-by-The-product-salt"],
  pmx_sw: ["PM Exercises: Swiggy questions", "https://www.productmanagementexercises.com/interview-questions/swiggy"],
  pmx_sw_rca: ["PM Exercises: Swiggy orders down 20%", "https://www.productmanagementexercises.com/11338/swiggy-observed-number-orders-compared-before-would-analysis"],
  pmx_sw_norush: ["PM Exercises: 'no rush' delivery for Instamart", "https://www.productmanagementexercises.com/9966/how-would-you-about-launching-rush-delivery-instamart-swiggy"],

  pmx_sw_aov: ["PM Exercises: Swiggy AOV +15%", "https://www.productmanagementexercises.com/11842/how-will-you-increase-aov-average-order-value-15%25-for-swiggy"],
  exp_sw_rest: ["Aced/Exponent: Swiggy product for restaurants", "https://www.tryexponent.com/questions/795/swiggy-pm-product-for-restaurants"],
  exp_sw: ["Aced/Exponent: Swiggy PM questions", "https://www.tryexponent.com/questions?company=swiggy&role=pm"],
  gd_sw_apm: ["Glassdoor: Swiggy APM interviews", "https://www.glassdoor.com/Interview/Swiggy-Associate-Product-Manager-Interview-Questions-EI_IE952680.0,6_KO7,32.htm"],
  gd_sw_pm: ["Glassdoor: Swiggy PM interviews", "https://www.glassdoor.co.in/Interview/Swiggy-Product-Manager-Interview-Questions-EI_IE952680.0,6_KO7,22.htm"],
  gd_inmobi: ["Glassdoor: InMobi question, Swiggy orders per day", "https://www.glassdoor.com/Interview/Guesstimate-Number-of-Swiggy-orders-being-delivered-everyday-QTN_3787307.htm"],
  md_sw20: ["Medium, PM Club: Swiggy orders dropped 20%", "https://medium.com/@pmclub/swiggys-orders-have-dropped-by-20-pm-interview-root-cause-analysis-0209596e3374"],
  md_sw_rev: ["Medium: Swiggy revenue +20% via product-led growth", "https://medium.com/design-bootcamp/pm-interview-question-you-are-pm-at-swiggy-food-delivery-vertical-and-target-give-to-you-is-to-bump-efe715e6f9bc"],

/* Saving: the artifact's own store on claude.ai is the record; this browser keeps a copy. */
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }
let dbRef = null, saveTimer = null, writing = false, dirty = false, lastSaved = null;
function queueSave() { saveLocal(); if (!dbRef) return; clearTimeout(saveTimer); saveTimer = setTimeout(flush, 600); }
async function flush() {
  if (!dbRef) return;
  if (writing) { dirty = true; return; }
  writing = true; dirty = false; setSync("Saving…");
  try { await dbRef.set(JSON.parse(JSON.stringify(state))); lastSaved = new Date(); setSync(`Saved to your tracker on claude.ai · ${lastSaved.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`); }
  catch (e) { setSync(e && e.code === "invalid_argument" ? "Read-only view: progress is kept in this browser only" : "Couldn't reach the tracker's storage. Progress is kept in this browser and will save on your next change."); }
  writing = false; if (dirty) flush();
}
function setSync(t) { const el = document.getElementById("sync"); if (el) el.textContent = t; }
(async () => {
  let db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
  if (!db) { setSync("Saving in this browser only (the tracker's storage isn't available in this view)"); return; }
  dbRef = db.doc("tracker/state");
  let first = true;
  dbRef.onSnapshot(snap => {
    if (snap.metadata.hasPendingWrites) return;
    if (snap.exists) {
      const merged = normalize(JSON.parse(JSON.stringify(snap.data())));
      const localHasMore = first && Object.keys(state.done).length > Object.keys(merged.done).length;
      if (!snap.metadata.fromCache) first = false;
      if (localHasMore) { queueSave(); return; }
      if (JSON.stringify(merged) !== JSON.stringify(state)) {
        const a = document.activeElement; if (a && a.classList && (a.classList.contains("note") || a.classList.contains("io"))) return;
        state = merged; saveLocal(); render();
      }
      setSync("Synced with your tracker on claude.ai");
    } else if (!snap.metadata.fromCache && first) { first = false; queueSave(); }
  }, () => setSync("Sync paused. Progress is kept in this browser."));
})();

    const nextQ = Q.map(q => QMAP[q[0]]).filter(q => (q.co === "Juspay" || q.co === "Swiggy") && !state.done[q.id]).slice(0, 2);
    const nextC = CASES.filter(c => !state.done[c.id]).slice(0, 2);
    const weak = [...Q.map(q => q[0]), ...CASES.map(c => c.id)].filter(id => state.rate[id] && state.rate[id] <= 2).slice(0, 4);
    head = `<div class="today-head"><div><div class="kicker" style="margin:0">Day ${ti} · after the 10-day plan</div><h2>Keep the reps going</h2><div class="meta">Two cases a day, plus a redo of anything rated 1 or 2 stars.</div></div></div>`;
    body = `<div class="card"><div class="block"><h4>Redo</h4>${weak.length ? weak.map(id => CMAP[id] ? caseRow(id) : qRow(id)).join("") : '<p class="srcl">Nothing rated 1 or 2 stars. Good.</p>'}</div>
      <div class="block"><h4>Next up</h4>${nextQ.map(q => qRow(q.id)).join("")}${nextC.map(c => caseRow(c.id)).join("")}</div><div style="height:10px"></div></div>`;
  }
  let carry = "";
  const upto = mode === "dated" ? ti - 1 : mode === "after" ? 10 : 0;
  if (upto > 0) {
    const groups = DAYS.slice(0, upto).map(d => {
      const tasks = allTasks(d).filter(t => !state.done[taskId(d, t)]);
      const prac = d.practice.filter(p => !state.done[itemKey(p)]);
      return (tasks.length || prac.length) ? `<div class="carry-day">Day ${d.n} · ${esc(d.title)}</div>${tasks.map(t => taskRow(d, t)).join("")}${prac.map(practiceRow).join("")}` : "";
    }).join("");
    const n = DAYS.slice(0, upto).reduce((a, d) => a + dayItems(d).filter(id => !state.done[id]).length, 0);
    carry = n ? `<section class="card"><header><h3>Carried over (${n})</h3><p>Unfinished items from earlier days. Fit in what you can; drop reading before practice.</p></header>${groups}<div style="height:10px"></div></section>` : "";
  }
  return `${head}${carry}${body}${dataPanel()}`;
}
function dataPanel() {
  const n = Object.keys(state.done).length + Object.keys(state.rate).length + Object.keys(state.notes).length;
  return `<section class="card"><header><h3>Your data</h3>
      <p>Every tick, rating and note saves to this tracker's own storage on claude.ai within a second, so it survives page updates, clearing this browser, and switching devices where you're signed in. This browser keeps a second copy. For your own copy, back up now and then.</p></header>
    <div class="filters" style="margin-top:10px"><button class="icon-btn primary" data-act="copy">Copy backup</button><button class="icon-btn" data-act="showbackup">${ui.showBackup ? "Hide backup text" : "Show backup text"}</button><span class="srcl">${n} saved entries</span>${ui.backupMsg ? `<span class="okmsg">${esc(ui.backupMsg)}</span>` : ""}</div>
    ${ui.showBackup ? `<textarea class="io" id="backupTxt" readonly>${esc(JSON.stringify(state))}</textarea>` : ""}
    <div class="block" style="margin-top:12px"><h4>Restore from a backup</h4>
      <textarea class="io" id="restoreTxt" placeholder="Paste backup text here"></textarea>
      <div class="filters" style="margin-top:8px">${ui.restoreArmed ? `<span class="errmsg">This replaces all current progress.</span><button class="icon-btn primary" data-act="restore-confirm">Replace my progress</button><button class="icon-btn" data-act="restore-cancel">Cancel</button>` : `<button class="icon-btn" data-act="restore">Restore</button>`}${ui.restoreMsg ? `<span class="${ui.restoreMsg.startsWith("Restored") ? "okmsg" : "errmsg"}">${esc(ui.restoreMsg)}</span>` : ""}</div></div>
    <div style="height:10px"></div></section>`;
}

/* ============ Schedule ============ */
function renderPlan() {
  const ti = todayIndex();
  if (ui.openDays === null) { ui.openDays = new Set(); const { day } = pickToday(); if (day) ui.openDays.add(day.id); }
  const card = d => {
    const items = dayItems(d), dn = countDone(items), complete = dn === items.length, isToday = ti === d.n;
    return `<details class="day ${isToday ? "today" : ""} ${complete ? "complete" : ""}" data-day="${d.id}" ${ui.openDays.has(d.id) ? "open" : ""}>
      <summary><div class="daynum">${d.n}</div><div class="daytitle"><h3>${esc(d.title)}</h3><div class="meta">${state.start ? dayDate(d.n) + " · " : ""}${esc(d.hours)} · primer: ${esc(d.primer[2])}</div></div>
        <span class="pill ${isToday ? "today" : complete ? "done" : ""}">${isToday ? "Today · " : ""}${dn}/${items.length}</span></summary>
      <div class="daybody"><p class="focus">${esc(d.focus)}</p>${dayBlocks(d)}</div></details>`;
  };
  return `<div class="section-head"><h2>Your 10-day plan</h2><p>Days 1 to 3 build breadth: skim Decode and Conquer for frameworks, read the casebook theory, and watch Exponent mocks. Days 4 to 10 go deep on one case type a day, with an Exponent peer mock and a mentor mock most days. Every day also has one industry primer and two apps to explore.</p></div>
    <section class="phase"><h3>Your resources and how the plan uses them</h3><div class="co-grid">${RES.map(r => `<div class="panel"><h3 style="font-size:16px">${esc(r.name)}</h3><p><strong>${esc(r.role)}</strong> ${esc(r.how)}</p></div>`).join("")}</div></section>
    <section class="phase"><h3>Phase 1 · Breadth on your own (Days 1 to 3)</h3>${DAYS.filter(d => d.phase === 1).map(card).join("")}</section>
    <section class="phase"><h3>Phase 2 · Seven days with experienced PMs (Days 4 to 10)</h3>${DAYS.filter(d => d.phase === 2).map(card).join("")}</section>
    <section class="phase"><h3>After day 10</h3><div class="tip">The Today tab switches to two cases a day plus redos of anything rated 1 or 2 stars. Keep reading one primer and exploring two apps daily.</div></section>`;
}

/* ============ Real questions ============ */
function bankFilter(q) {
  const s = ui.search.trim().toLowerCase();
  return (ui.type === "all" || q.type === ui.type)
    && (ui.co === "all" || q.co === ui.co)
    && (ui.status === "all" || (ui.status === "todo" && !state.done[q.id]) || (ui.status === "done" && state.done[q.id]) || (ui.status === "flag" && state.flag[q.id]) || (ui.status === "rep" && q.badge === "R") || (ui.status === "weak" && state.rate[q.id] && state.rate[q.id] <= 2))
    && (!s || (q.text + " " + q.co + " " + q.hint).toLowerCase().includes(s));
}
function renderBank() {
  const all = Q.map(q => QMAP[q[0]]);
  const cos = [...new Set(all.map(q => q.co))].sort((a, b) => a === "Various" ? 1 : b === "Various" ? -1 : a.localeCompare(b));
  const chips = [`<button class="chip" data-type="all" aria-pressed="${ui.type === "all"}">All<span class="n">${countDone(all.map(q => q.id))}/${all.length}</span></button>`,
    ...TYPES.map(t => { const ids = all.filter(q => q.type === t.id).map(q => q.id); return ids.length ? `<button class="chip" data-type="${t.id}" aria-pressed="${ui.type === t.id}">${esc(t.name)}<span class="n">${countDone(ids)}/${ids.length}</span></button>` : ""; })].join("");
  const groups = TYPES.map(t => {
    const qs = all.filter(q => q.type === t.id).filter(bankFilter);
    const avg = avgOf(all.filter(q => q.type === t.id).map(q => q.id));
    return qs.length ? `<section class="cat"><header><h3>${esc(t.name)}${avg ? ` <span class="srcl">· avg ${avg}★</span>` : ""}</h3><p>${esc(t.blurb)}</p></header>${qs.map(q => qRow(q.id)).join("")}</section>` : "";
  }).join("");
  const nRep = all.filter(q => q.badge === "R").length;
  return `<div class="section-head"><h2>Real questions</h2><p>${all.length} questions, ${nRep} of them reported as asked, from candidate reports (Glassdoor, Grapevine, Medium write-ups), company-tagged question banks (PM Exercises, Aced/Exponent) and interview guides. Rate each one after you practise it. The casebooks' ${CASES.length} cases have their own tab.</p></div>
    <div class="legend"><span><span class="tag rep">Reported</span> a candidate or company-tagged bank says it was asked</span><span><span class="tag gd">Guide</span> typical question per a prep guide</span><span><span class="tag plain">Practice</span> written for the company's business, not reported</span></div>
    <div class="filters">${chips}</div>
    <div class="filters"><input class="search" id="qsearch" type="search" placeholder="Search: UPI, churn, Instamart…" value="${esc(ui.search)}">
      <select class="sel" id="qco" aria-label="Company"><option value="all">All companies</option>${cos.map(c => `<option value="${esc(c)}" ${ui.co === c ? "selected" : ""}>${esc(c === "Various" ? "Multiple / general" : c)}</option>`).join("")}</select>
      <select class="sel" id="qstatus" aria-label="Status">${[["all","All statuses"],["rep","Reported only"],["todo","Not done"],["done","Done"],["weak","Rated 1 to 2 stars"],["flag","Flagged"]].map(o => `<option value="${o[0]}" ${ui.status === o[0] ? "selected" : ""}>${o[1]}</option>`).join("")}</select></div>
    ${groups || '<p class="srcl">No questions match these filters.</p>'}`;
}

function renderFocus() {
  const co = ui.focusCo, f = FOCUS[co];
  const qs = Q.map(q => QMAP[q[0]]).filter(q => q.co === co);
  const rep = qs.filter(q => q.badge !== "P"), prac = qs.filter(q => q.badge === "P");
  const cases = CASES.filter(c => c.asked === co);
  const list = a => `<ul>${a.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
  const ids = [...qs.map(q => q.id), ...cases.map(c => c.id)], avg = avgOf(ids);
  return `<div class="section-head"><h2>Juspay &amp; Swiggy</h2><p>Only what's been reported for PM and APM roles at these two companies, plus prep that follows from it. Ticks and ratings here also count in the other tabs.</p></div>
    <div class="cotabs">${["Juspay", "Swiggy"].map(c => `<button data-focus="${c}" aria-pressed="${co === c}">${c}</button>`).join("")}</div>
    <p class="srcl" style="margin:-4px 0 14px">${countDone(ids)} of ${ids.length} attempted · average rating ${avg ? avg + "★" : "none yet"}</p>
    <div class="co-grid"><div class="panel"><h3>Interview process reported</h3>${list(f.process)}</div><div class="panel"><h3>What they test</h3>${list(f.tests)}</div></div>
    <div class="panel" style="margin-bottom:14px"><h3>Prep checklist</h3>${list(f.prep)}</div>
    <section class="cat"><header><h3>Questions reported for ${co}</h3><p>${rep.filter(q => q.badge === "R").length} reported, ${rep.filter(q => q.badge === "G").length} from guides. Open "Hint & notes" to see the source.</p></header>${rep.map(q => qRow(q.id)).join("")}</section>
    ${cases.length ? `<section class="cat"><header><h3>${co} cases in your casebooks</h3></header>${cases.map(c => caseRow(c.id)).join("")}</section>` : ""}
    ${prac.length ? `<section class="cat"><header><h3>Practice cases modelled on ${co}'s business</h3><p>Not reported questions. They cover the payments topics Juspay's reported rounds touch.</p></header>${prac.map(q => qRow(q.id)).join("")}</section>` : ""}
    <div class="panel"><h3>Sources for ${co}</h3><ul>${f.srcs.map(k => `<li>${srcLink(k)}</li>`).join("")}</ul>
      <p class="srcl">${co === "Juspay" ? "Juspay has much less public PM interview data than Swiggy, and its process has varied across years and roles. Treat it as indicative." : "Several Swiggy items come from prep guides rather than candidates; they're marked Guide."}</p></div>`;
}

function renderCases() {
  const s = ui.cbSearch.trim().toLowerCase();
  const base = CASES.filter(c => ui.cbBook === "all" || c.book === ui.cbBook);
  const list = base.filter(c => (ui.cbSeg === "all" || c.seg === ui.cbSeg)
    && (ui.cbStatus === "all" || (ui.cbStatus === "todo" && !state.done[c.id]) || (ui.cbStatus === "done" && state.done[c.id]) || (ui.cbStatus === "weak" && state.rate[c.id] && state.rate[c.id] <= 2) || (ui.cbStatus === "flag" && state.flag[c.id]))
    && (!s || (c.name + " " + c.prompt + " " + c.asked).toLowerCase().includes(s)));
  const segChips = [`<button class="chip" data-cbseg="all" aria-pressed="${ui.cbSeg === "all"}">All<span class="n">${base.filter(c => state.done[c.id]).length}/${base.length}</span></button>`,
    ...Object.keys(SEGS).map(k => { const n = base.filter(c => c.seg === k); return n.length ? `<button class="chip" data-cbseg="${k}" aria-pressed="${ui.cbSeg === k}">${SEGS[k]}<span class="n">${n.filter(c => state.done[c.id]).length}/${n.length}</span></button>` : ""; })].join("");
  const card = c => {
    const done = !!state.done[c.id], open = ui.open.has(c.id), flag = !!state.flag[c.id];
    return `<article class="case ${done ? "is-done" : ""}">
      <div class="top"><span class="seg seg-${c.seg}">${SEGS[c.seg]}</span>${c.asked ? `<span class="tag rep">Asked at ${esc(c.asked)}</span>` : ""}</div>
      <h4><a href="${pdfHref(c.book, c.page)}" target="_blank" rel="noopener">${esc(c.name)} ↗</a></h4><div class="prompt">${esc(c.prompt)}</div>
      <div class="meta">${BOOKS[c.book].short} · p.${c.page}${c.lvl ? " · " + c.lvl : ""}${state.notes[c.id] ? ' · <span class="tag plain">notes</span>' : ""}</div>
      <div class="ctl"><label><input type="checkbox" class="check" data-toggle="${c.id}" ${done ? "checked" : ""}> Attempted</label>${rateHtml(c.id)}</div>
      <div class="actions" style="justify-content:flex-start"><button class="icon-btn" data-expand="${c.id}" aria-expanded="${open}">${open ? "Hide notes" : "Notes"}</button><button class="icon-btn" data-flag="${c.id}" aria-pressed="${flag}">${flag ? "Revisit" : "Flag"}</button></div>
      ${open ? `<textarea class="note" id="note-${c.id}" data-note="${c.id}" placeholder="What went well, what you missed, mentor feedback">${esc(state.notes[c.id] || "")}</textarea>` : ""}
    </article>`;
  };
  const avg = avgOf(base.map(c => c.id));
  return `<div class="section-head"><h2>Casebooks</h2><p>${CASES.length} practice cases from the IIMA Product Mindset (2026-27) and IIMB Sigma (2026-27) casebooks. A case name opens the PDF in a new tab at that page. Come back here to tick, rate and write notes. "Asked at" is the company the casebook says asked it.${avg ? ` Your average: ${avg}★.` : ""}</p></div>
    <div class="kicker">Theory and industry primers</div>
    <div class="readlist">${READING.map(r => `<a href="${pdfHref(r.book, r.page)}" target="_blank" rel="noopener">${esc(r.name)}<span>${BOOKS[r.book].short} p.${r.page} ↗</span></a>`).join("")}</div>
    <div class="filters">${[["all","Both books"],["iima","IIMA"],["sigma","Sigma (IIMB)"]].map(b => `<button class="chip" data-cbbook="${b[0]}" aria-pressed="${ui.cbBook === b[0]}">${b[1]}</button>`).join("")}</div>
    <div class="filters">${segChips}</div>
    <div class="filters"><input class="search" id="cbsearch" type="search" placeholder="Search cases: Swiggy, UPI, elderly…" value="${esc(ui.cbSearch)}">
      <select class="sel" id="cbstatus" aria-label="Status">${[["all","All"],["todo","Not attempted"],["done","Attempted"],["weak","Rated 1 to 2 stars"],["flag","Flagged"]].map(o => `<option value="${o[0]}" ${ui.cbStatus === o[0] ? "selected" : ""}>${o[1]}</option>`).join("")}</select></div>
    <div class="cbgrid">${list.map(card).join("") || '<p class="srcl">No cases match these filters.</p>'}</div>`;
}

function renderConcepts() {
  return `<div class="section-head"><h2>Concepts &amp; frameworks</h2><p>Tick a concept when you can explain it in under a minute without notes. "Read" opens the matching casebook page in a new tab.</p></div>
    ${CONCEPTS.map(g => `<h3 class="kicker" style="margin-top:20px">${esc(g.g)}</h3><div class="co-grid">${g.items.map(c => {
      const done = !!state.done[c.id];
      return `<article class="panel" style="${done ? "border-color:var(--good)" : ""}"><div style="display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px">
        <input type="checkbox" class="check" id="cb-${c.id}" data-toggle="${c.id}" ${done ? "checked" : ""} aria-label="I can explain ${esc(c.name)}">
        <div style="min-width:0"><h3 style="font-size:16px"><label for="cb-${c.id}">${esc(c.name)}</label></h3><p>${esc(c.what)}</p>
        ${c.list ? `<ul>${c.list.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
        ${c.ex ? `<p class="srcl">${esc(c.ex)}</p>` : ""}
        ${c.ref ? `<p>${pdfLink(c.ref[0], c.ref[1], `Read in ${BOOKS[c.ref[0]].short}, p.${c.ref[1]}`)}</p>` : ""}</div></div></article>`;
    }).join("")}</div>`).join("")}`;
}

function renderSources() {
  const used = [...new Set(Q.map(q => q[4]).filter(Boolean))];
  return `<div class="section-head"><h2>Sources and method</h2><p>I searched Glassdoor, Grapevine, Medium and Substack write-ups, LinkedIn posts, Blind, and company-tagged question banks for APM and PM-1 questions, with a separate pass for Juspay and Swiggy. No Reddit threads surfaced for these companies, so none are cited. Direct page fetches were blocked in my research environment, so details come from search-engine extracts of these pages.</p></div>
    <div class="panel"><ul>${used.map(k => `<li>${srcLink(k)}</li>`).join("")}</ul></div>
    <h3 class="kicker" style="margin-top:20px">Also useful</h3>
    <div class="panel"><ul><li>${srcLink("hpm_rca")}</li><li>${srcLink("ag_ai")}</li><li>Decode and Conquer, Lewis Lin (CIRCLES)</li><li>Cracking the PM Interview, Gayle McDowell and Jackie Bavaro</li></ul></div>`;
}

function render() {
  const y = window.scrollY;
  renderStats();
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === ui.tab)));
  const a = document.activeElement, aid = a && a.id, caret = a && (aid === "qsearch" || aid === "cbsearch") ? a.selectionStart : null;
  document.getElementById("main").innerHTML = { today: renderToday, plan: renderPlan, bank: renderBank, focus: renderFocus, cases: renderCases, concepts: renderConcepts, sources: renderSources }[ui.tab]();
  if (aid) { const el = document.getElementById(aid); if (el) { try { el.focus({ preventScroll: true }); } catch (e) {} if (caret != null && el.setSelectionRange) el.setSelectionRange(caret, caret); } }
  window.scrollTo(0, y);
}

/* ============ Events ============ */
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.toggle) { const id = t.dataset.toggle; if (t.checked) state.done[id] = true; else delete state.done[id]; queueSave(); render(); }
  else if (t.id === "startDate") { state.start = t.value || null; ui.openDays = null; queueSave(); render(); }
  else if (t.id === "qstatus") { ui.status = t.value; render(); }
  else if (t.id === "qco") { ui.co = t.value; render(); }
  else if (t.id === "cbstatus") { ui.cbStatus = t.value; render(); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset && t.dataset.note) { const id = t.dataset.note; if (t.value.trim()) state.notes[id] = t.value; else delete state.notes[id]; queueSave(); }
  else if (t.id === "qsearch") { ui.search = t.value; render(); }
  else if (t.id === "cbsearch") { ui.cbSearch = t.value; render(); }
});
function copyBackup() {
  const txt = JSON.stringify(state);
  const done = ok => { ui.backupMsg = ok ? "Copied. Paste it somewhere safe (a note or an email to yourself)." : "Couldn't copy here. Select the text below and copy it."; if (!ok) ui.showBackup = true; render(); };
  try { navigator.clipboard.writeText(txt).then(() => done(true), () => done(false)); } catch (e) { done(false); }
}
function doRestore() {
  const el = document.getElementById("restoreTxt"); const raw = (el && el.value || ui.pendingRestore || "").trim();
  try { const parsed = JSON.parse(raw); if (!parsed || typeof parsed !== "object" || typeof parsed.done !== "object") throw 0; state = normalize(parsed); ui.restoreMsg = "Restored."; queueSave(); }
  catch (e) { ui.restoreMsg = "That doesn't look like a backup from this tracker. Nothing changed."; }
  ui.restoreArmed = false; ui.pendingRestore = ""; render();
}
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const d = b.dataset;
  if (b.id === "themeBtn") { const next = effectiveTheme() === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = next; try { localStorage.setItem("pp-theme", next); } catch (err) {} paintThemeBtn(); return; }
  if (d.tab) { ui.tab = d.tab; try { history.replaceState(null, "", "#" + ui.tab); } catch (err) {} render(); window.scrollTo({ top: 0 }); }
  else if (d.rate && d.rid) { const id = d.rid, v = +d.rate; if (state.rate[id] === v) delete state.rate[id]; else { state.rate[id] = v; state.done[id] = true; } queueSave(); render(); }
  else if (d.flag) { if (state.flag[d.flag]) delete state.flag[d.flag]; else state.flag[d.flag] = true; queueSave(); render(); }
  else if (d.expand) { ui.open.has(d.expand) ? ui.open.delete(d.expand) : ui.open.add(d.expand); render(); const n = document.getElementById("note-" + d.expand); if (n) try { n.focus({ preventScroll: true }); } catch (err) {} }
  else if (d.type) { ui.type = d.type; render(); }
  else if (d.focus) { ui.focusCo = d.focus; render(); }
  else if (d.cbbook) { ui.cbBook = d.cbbook; render(); }
  else if (d.cbseg) { ui.cbSeg = d.cbseg; render(); }
  else if (d.act === "copy") copyBackup();
  else if (d.act === "showbackup") { ui.showBackup = !ui.showBackup; render(); }
  else if (d.act === "restore") { const el = document.getElementById("restoreTxt"); ui.pendingRestore = el ? el.value : ""; if (!ui.pendingRestore.trim()) { ui.restoreMsg = "Paste your backup text first."; render(); return; } ui.restoreArmed = true; ui.restoreMsg = ""; render(); const r = document.getElementById("restoreTxt"); if (r) r.value = ui.pendingRestore; }
  else if (d.act === "restore-confirm") doRestore();
  else if (d.act === "restore-cancel") { ui.restoreArmed = false; ui.pendingRestore = ""; render(); }
});
document.addEventListener("toggle", e => { const d = e.target; if (!d.dataset || !d.dataset.day || !ui.openDays) return; if (d.open) ui.openDays.add(d.dataset.day); else ui.openDays.delete(d.dataset.day); }, true);

render();
</script>
