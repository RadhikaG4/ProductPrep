<title>ProductPrep Desk</title>
<script>
(function(){try{var s=JSON.parse(localStorage.getItem('productprep.desk.v1')||'{}');var t=s&&s.profile&&s.profile.theme;if(t==='light'||t==='dark'){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();
</script>
<style>
:root{
  color-scheme: light;
  --bg:#f6f4ef; --surface:#ffffff; --surface-2:#faf9f6; --surface-3:#f1efe9;
  --ink:#1b1b1a; --ink-2:#52514e; --ink-3:#6b6964;
  --line:#e6e3db; --line-2:#d5d1c7;
  --accent:#c42b35; --accent-2:#a3222b; --accent-soft:#fbecec;
  --gold:#a86b0c; --gold-2:#d99a26; --gold-soft:#fbf1dd; --brand:#256abf;
  --flame:#e2621b;
  --focus:#2a78d6;
  --series-1:#2a78d6;
  --g-N:#256abf; --g-U:#86b6ef; --g-P:#f0a09b; --g-M:#c8312f; --g-0:#ebe8e1; --g-X:#a39d90; --g-X-ink:#ffffff;
  --g-N-ink:#ffffff; --g-U-ink:#0d2a4d; --g-P-ink:#4a1210; --g-M-ink:#ffffff;
  --hm-0:#eceae4; --hm-1:#86b6ef; --hm-2:#3987e5; --hm-3:#1c5cab; --hm-4:#0d366b;
  --upd-bg:#fff6df; --upd-line:#e0ad3c; --upd-ink:#6b4700;
  --ind-bg:#eaf2fc; --ind-line:#7fb0ec; --ind-ink:#17457f;
  --note-bg:#fff9c9; --note-ink:#5a4b00;
  --ok:#0b7a3b;
  --shadow:0 1px 2px rgba(20,18,12,.05),0 4px 14px rgba(20,18,12,.05);
  --shadow-lg:0 10px 40px rgba(20,18,12,.18);
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:Cambria,"Sitka Text",Charter,"Iowan Old Style","Palatino Linotype",Georgia,serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0f1012; --surface:#17191c; --surface-2:#1c1f23; --surface-3:#22252a;
    --ink:#ecebe6; --ink-2:#b9b7b0; --ink-3:#95938c;
    --line:#2a2d32; --line-2:#383c42;
    --accent:#ff6b6b; --accent-2:#ff8a8a; --accent-soft:#3a1c1f;
    --gold:#e8b44f; --gold-2:#f0c46a; --gold-soft:#342a14; --brand:#6aa6ec;
    --flame:#ff8a3d;
    --focus:#5b9ae6;
    --series-1:#3987e5;
    --g-N:#5b9ae6; --g-U:#1f5aa3; --g-P:#8e3533; --g-M:#ea6a67; --g-0:#34373c; --g-X:#6d7178; --g-X-ink:#ffffff;
    --g-N-ink:#0b1a2e; --g-U-ink:#ffffff; --g-P-ink:#ffffff; --g-M-ink:#2a0d0c;
    --hm-0:#25282c; --hm-1:#184f95; --hm-2:#2a78d6; --hm-3:#6da7ec; --hm-4:#b7d3f6;
    --upd-bg:#2d2513; --upd-line:#8a6a1f; --upd-ink:#f1d189;
    --ind-bg:#14233a; --ind-line:#2f619f; --ind-ink:#a9ccf5;
    --note-bg:#33301a; --note-ink:#f0e39a;
    --ok:#3ecf7a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
    --shadow-lg:0 10px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0f1012; --surface:#17191c; --surface-2:#1c1f23; --surface-3:#22252a;
  --ink:#ecebe6; --ink-2:#b9b7b0; --ink-3:#95938c;
  --line:#2a2d32; --line-2:#383c42;
  --accent:#ff6b6b; --accent-2:#ff8a8a; --accent-soft:#3a1c1f;
  --gold:#e8b44f; --gold-2:#f0c46a; --gold-soft:#342a14; --brand:#6aa6ec;
  --flame:#ff8a3d;
  --focus:#5b9ae6;
  --series-1:#3987e5;
  --g-N:#5b9ae6; --g-U:#1f5aa3; --g-P:#8e3533; --g-M:#ea6a67; --g-0:#34373c; --g-X:#6d7178; --g-X-ink:#ffffff;
  --g-N-ink:#0b1a2e; --g-U-ink:#ffffff; --g-P-ink:#ffffff; --g-M-ink:#2a0d0c;
  --hm-0:#25282c; --hm-1:#184f95; --hm-2:#2a78d6; --hm-3:#6da7ec; --hm-4:#b7d3f6;
  --upd-bg:#2d2513; --upd-line:#8a6a1f; --upd-ink:#f1d189;
  --ind-bg:#14233a; --ind-line:#2f619f; --ind-ink:#a9ccf5;
  --note-bg:#33301a; --note-ink:#f0e39a;
  --ok:#3ecf7a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  --shadow-lg:0 10px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
kbd{font:600 11px/1 var(--mono);padding:3px 5px;border-radius:5px;border:1px solid var(--line-2);border-bottom-width:2px;background:var(--surface-2);color:var(--ink-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);grid-template-rows:60px 1fr;min-height:100vh}
.topbar{grid-column:1/-1;position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font:700 13px/1 var(--serif);letter-spacing:.02em}
.brand-name{font-weight:700;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.pill-sample{font:600 11px/1 var(--sans);padding:4px 7px;border-radius:999px;background:var(--gold-soft);color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);white-space:nowrap}
.tb-grow{flex:0 1 24px}
.lvl{display:flex;align-items:center;gap:12px;padding:6px 14px 6px 8px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);text-decoration:none;min-width:0;flex:1 1 420px;max-width:760px;margin-left:auto}
.lvl-badge{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold);font:700 12px/1 var(--sans);border:1.5px solid var(--gold-2)}
.lvl-txt{display:grid;grid-template-columns:1fr auto;align-items:center;gap:5px 12px;min-width:0;flex:1}
.lvl-name{font:600 13px/1.1 var(--sans);white-space:nowrap}
.xpbar{grid-column:1 / -1;order:3;width:100%;height:10px;border-radius:6px;background:var(--surface-3);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}
.xpbar>span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-2));border-radius:6px;box-shadow:0 0 8px var(--gold-2);transition:width .6s ease}
.lvl-xp{font:500 11px/1 var(--sans);color:var(--ink-3);white-space:nowrap}
.tb-stat{text-decoration:none;color:inherit;display:flex;align-items:center;gap:7px;font:600 13px/1 var(--sans);white-space:nowrap;padding:6px 4px}
.tb-stat small{font-weight:500;color:var(--ink-3)}
.tb-stat .flame{color:var(--flame)}
.ring{width:26px;height:26px}
.ring circle{fill:none;stroke-width:4}
.ring .trk{stroke:var(--surface-3)}
.ring .val{stroke:var(--ok);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .5s}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
.icon-btn:hover{color:var(--ink);border-color:var(--line-2)}
.sidenav{position:sticky;top:60px;align-self:start;height:calc(100vh - 60px);overflow:auto;padding:16px 12px;border-right:1px solid var(--line);background:var(--surface-2);display:flex;flex-direction:column;gap:2px}
.nav-a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;text-decoration:none;color:var(--ink-2);font-weight:500}
.nav-a:hover{background:var(--surface-3);color:var(--ink)}
.nav-a.on{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);font-weight:600}
.nav-a .cnt{margin-left:auto;font:600 11.5px/1 var(--sans);color:var(--ink-3)}
.nav-a .due{margin-left:auto;font:700 11px/1 var(--sans);padding:3px 7px;border-radius:999px;background:var(--accent);color:#fff}
.nav-sep{height:1px;background:var(--line);margin:10px 6px}
.nav-foot{margin-top:auto;padding:10px;font-size:12px;color:var(--ink-3);line-height:1.45}
.nav-foot .save{display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--ok)}
.dot.bad{background:var(--accent)}
main{padding:28px 34px 80px;min-width:0}
.wrap{max-width:1120px;margin:0 auto}

/* ---------- common */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
h1{font:700 26px/1.2 var(--sans);letter-spacing:-.015em;margin:0}
h2{font:650 17px/1.3 var(--sans);margin:0 0 12px;letter-spacing:-.005em}
h3{margin:0}
.sub{color:var(--ink-2);margin:6px 0 0;max-width:760px}
.muted{color:var(--ink-3)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.panel+.panel{margin-top:16px}
.grid>.panel+.panel,.grid>.panel{margin-top:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.stack-gap>*+*{margin-top:16px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:500 14px/1.2 var(--sans);text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.primary kbd{background:transparent;color:inherit;border-color:color-mix(in srgb,var(--surface) 45%,transparent)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-3);color:var(--ink)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.chip{display:inline-flex;align-items:center;gap:5px;font:500 12px/1 var(--sans);padding:5px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap;text-decoration:none}
a.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip.upd{background:var(--upd-bg);color:var(--upd-ink);border-color:color-mix(in srgb,var(--upd-line) 50%,transparent)}
.chip.ind{background:var(--ind-bg);color:var(--ind-ink);border-color:color-mix(in srgb,var(--ind-line) 50%,transparent)}
.chip.ts{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.chip.new{background:transparent}
.chip.d-Core{}
.chip .sw{width:9px;height:9px;border-radius:3px}
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:1px dashed color-mix(in srgb,var(--gold) 60%,transparent);background:var(--gold-soft);color:var(--ink);margin-bottom:16px;font-size:14px}
.banner b{color:var(--gold)}
.mini-label{font:600 11.5px/1.2 var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.hint{color:var(--ink-3);font-size:13px;margin:6px 0 0}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-weight:600;color:var(--ink-2);font-size:12.5px}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
details.tv{margin-top:10px}
details.tv>summary{cursor:pointer;color:var(--ink-3);font-size:12.5px;list-style:none;display:inline-flex;align-items:center;gap:6px}
details.tv>summary::-webkit-details-marker{display:none}
details.tv>summary::before{content:"";width:0;height:0;border-left:5px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s}
details.tv[open]>summary::before{transform:rotate(90deg)}

/* ---------- tiles, stacks, legend */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{padding:14px 16px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.tile .t-label{font-size:12.5px;color:var(--ink-2)}
.tile .t-val{font:650 26px/1.15 var(--sans);letter-spacing:-.01em;margin-top:4px}
.tile .t-sub{font-size:12px;color:var(--ink-3);margin-top:3px}
.hero{display:flex;flex-direction:column;justify-content:center}
.hero .h-val{font:700 56px/1 var(--sans);letter-spacing:-.03em}
.hero .h-label{font:600 14px/1.2 var(--sans);color:var(--ink-2)}
.hero .h-sub{font-size:12.5px;color:var(--ink-3);margin-top:8px;max-width:360px}
.stack{display:flex;gap:2px;height:12px;width:100%;min-width:40px}
.stack .seg{height:100%;min-width:3px}
.stack .seg:last-child{border-radius:0 4px 4px 0}
.s-N{background:var(--g-N)} .s-U{background:var(--g-U)} .s-P{background:var(--g-P)} .s-M{background:var(--g-M)} .s-X{background:var(--g-X)} .s-0{background:var(--g-0)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--ink-2);margin:2px 0 12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .sw{width:11px;height:11px;border-radius:3px}
.brows{display:flex;flex-direction:column}
.brow{display:grid;grid-template-columns:minmax(120px,230px) minmax(0,1fr) 64px 48px;gap:12px;align-items:center;padding:7px 8px;margin:0 -8px;border-radius:8px;background:none;border:0;text-align:left;width:calc(100% + 16px)}
.brow:hover{background:var(--surface-2)}
.brow .bl{font-size:13.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .bl small{color:var(--ink-3);font-size:12px}
.brow .bn{font-size:12.5px;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
.brow .bs{font-size:12.5px;color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums}
.bgroup{font:600 12px/1 var(--sans);color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase;margin:12px 0 4px}
.meter{height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.meter>span{display:block;height:100%;background:var(--series-1);border-radius:0 4px 4px 0}

/* ---------- heatmap */
.hm-row{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.hm-side{display:grid;grid-template-columns:repeat(2,minmax(84px,1fr));gap:12px 18px;margin-top:18px;flex:1;min-width:190px}
.hs-v{font:650 22px/1.1 var(--sans)}
.hs-l{font-size:12px;color:var(--ink-3);margin-top:2px}
.hm-wrap{display:flex;gap:8px;align-items:flex-start}
.hm-days{display:grid;grid-template-rows:repeat(7,14px);gap:3px;font-size:10.5px;color:var(--ink-3);margin-top:18px}
.hm-days span{line-height:14px}
.hm-main{overflow-x:auto}
.hm-months{display:grid;grid-auto-flow:column;grid-auto-columns:14px;gap:3px;font-size:10.5px;color:var(--ink-3);height:15px;margin-bottom:3px;white-space:nowrap}
.hm{display:grid;grid-template-rows:repeat(7,14px);grid-auto-flow:column;grid-auto-columns:14px;gap:3px}
.hm i{display:block;width:14px;height:14px;border-radius:3px;background:var(--hm-0)}
.hm i.l1{background:var(--hm-1)} .hm i.l2{background:var(--hm-2)} .hm i.l3{background:var(--hm-3)} .hm i.l4{background:var(--hm-4)}
.hm i.today{box-shadow:0 0 0 1.5px var(--ink)}
.hm i.future{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.hm-leg{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--ink-3);margin-top:10px}
.hm-leg i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* ---------- filters */
.filters{position:sticky;top:60px;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);padding:12px 0 10px;margin:14px 0 6px;border-bottom:1px solid var(--line)}
.frow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.frow+.frow{margin-top:8px}
.search{position:relative;flex:1 1 220px;max-width:360px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.input,.select{font:14px/1.2 var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:8px 10px;min-height:36px}
.search .input{width:100%;padding-left:32px}
.select{padding-right:28px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;max-width:230px}
.tog{display:inline-flex;align-items:center;gap:6px;font:500 13px/1 var(--sans);padding:8px 11px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2)}
.tog[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.seg-ctl{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg-ctl button{border:0;background:none;padding:8px 12px;font:500 13px/1 var(--sans);color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.seg-ctl button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.rinfo{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-3);margin-left:auto}
.linkish{background:none;border:0;padding:0;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;font-size:13px}

/* ---------- question cards */
.qlist{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 22px 20px;box-shadow:var(--shadow);scroll-margin-top:130px}
.qcard.focus{padding:26px 30px 28px}
.qmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.crumb{font:500 12.5px/1.2 var(--sans);color:var(--ink-3);margin-right:4px}
.crumb .sep{margin:0 3px}
.grow{flex:1}
.flag{width:32px;height:32px}
.flag.on{color:var(--gold);border-color:var(--gold-2);background:var(--gold-soft)}
.flag.on svg{fill:currentColor}
.qtext{font:700 19px/1.42 var(--serif);color:var(--accent);margin:12px 0 14px;letter-spacing:-.003em}
.qcard.focus .qtext{font-size:22px}
.qactions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.timer{font-variant-numeric:tabular-nums}
.timer.run{color:var(--ink);background:var(--surface-3)}
.timer.done{color:var(--accent);background:var(--accent-soft)}
.answer{margin-top:16px;border-top:1px solid var(--line);padding-top:18px}
.ans-grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:26px}
.prose{font:16.5px/1.62 var(--serif);color:var(--ink)}
.prose p{margin:0 0 12px}
.prose ul,.prose ol{margin:0 0 12px;padding-left:1.35em}
.prose li{margin:0 0 7px}
.prose li::marker{color:var(--ink-3)}
.prose ol>li::marker{font-weight:700;color:var(--accent)}
.prose b{font-weight:700}
.prose ul.fs{list-style:none;padding-left:0}
.prose ul.fs li{padding-left:0}
.t{width:100%;border-collapse:collapse;font:13.5px/1.45 var(--sans);margin:4px 0 14px}
.t th,.t td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.t thead th{font-weight:600;color:var(--ink-2);background:var(--surface-2);border-bottom:1px solid var(--line-2)}
.t td:first-child{font-weight:600;color:var(--ink-2)}
.t.compact th,.t.compact td{padding:6px 8px;font-size:13px}
.formula{font:italic 16px/1.5 var(--serif);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0 12px;text-align:center;overflow-x:auto;white-space:nowrap}
.orig{display:inline-flex;align-items:center;gap:7px;margin-top:6px;font:500 13px/1.2 var(--sans);color:var(--ink-2);text-decoration:none;padding:7px 10px;border-radius:9px;border:1px solid var(--line)}
.orig:hover{color:var(--ink);border-color:var(--ink-3)}
.sources{font:12.5px/1.6 var(--sans);color:var(--ink-3);margin-top:8px}
.sources a{color:var(--ink-2)}
details.follow{margin:6px 0 12px;font:14px/1.5 var(--sans);border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--surface-2)}
details.follow>summary{cursor:pointer;padding:9px 0;font-weight:600;color:var(--ink-2)}
details.follow ul{margin:0 0 10px;padding-left:1.2em}
details.follow li{margin-bottom:6px}
.callout{padding:12px 14px;border-radius:10px;margin:0 0 12px;font-size:14px;line-height:1.5}
.callout .c-label{display:flex;align-items:center;gap:6px;font:700 11px/1.2 var(--sans);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;opacity:.9}
.callout p{margin:0}
.callout.take{background:var(--accent-soft);border-left:3px solid var(--accent)}
.callout.take .c-label{color:var(--accent)}
.callout.take p{font:700 15px/1.45 var(--serif);color:var(--accent-2)}
.callout.upd{background:var(--upd-bg);border-left:3px solid var(--upd-line);color:var(--upd-ink)}
.callout.ind{background:var(--ind-bg);border-left:3px solid var(--ind-line);color:var(--ind-ink)}
.callout.mynote{background:var(--note-bg);color:var(--note-ink);border-left:3px solid color-mix(in srgb,var(--note-ink) 45%,transparent)}
.gradebox{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line-2)}
.grade-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.gbtn{display:inline-flex;align-items:center;gap:9px;padding:8px 12px 8px 8px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface);font:500 14px/1.2 var(--sans)}
.gbtn:hover{border-color:var(--ink-3)}
.gicon{width:24px;height:24px;border-radius:7px;display:grid;place-items:center}
.gicon svg{width:15px;height:15px;stroke-width:2.6}
.g-N .gicon{background:var(--g-N);color:var(--g-N-ink)} .g-U .gicon{background:var(--g-U);color:var(--g-U-ink)}
.g-P .gicon{background:var(--g-P);color:var(--g-P-ink)} .g-M .gicon{background:var(--g-M);color:var(--g-M-ink)} .g-X .gicon{background:var(--g-X);color:var(--g-X-ink)}
.gbtn.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink);font-weight:650}
.gbtn kbd{margin-left:2px}
.stchip{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--sans);padding:3px 9px 3px 3px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2)}
.stchip .gicon{width:18px;height:18px;border-radius:50%}
.stchip .gicon svg{width:11px;height:11px}
.reflect{margin-top:14px;display:flex;flex-direction:column;gap:12px}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tags .mini-label{margin-right:6px}
.tag{font:500 12.5px/1 var(--sans);padding:6px 10px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2)}
.tag.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.note{display:flex;flex-direction:column;gap:6px;position:relative}
.note textarea{font:14px/1.45 var(--sans);color:var(--ink);background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;padding:9px 11px;resize:vertical;min-height:52px}
.note .count{position:absolute;right:10px;bottom:8px;font-size:11px;color:var(--ink-3)}
.attempt-line{font-size:12.5px;color:var(--ink-3)}
.focus-top{display:flex;align-items:center;gap:14px;margin:14px 0 12px}
.fprog{flex:1;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.fbar{height:100%;background:var(--ink);border-radius:0 3px 3px 0;transition:width .25s}
.fnav{display:flex;align-items:center;gap:6px}
.fpos{font:600 13px/1 var(--sans);color:var(--ink-2);min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.kbd-hint{margin-top:12px;font-size:12.5px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:12px}
.kbd-hint span{display:inline-flex;align-items:center;gap:5px}
.more{margin:16px auto 0;display:flex}
.empty{padding:40px 20px;text-align:center;color:var(--ink-3)}

/* ---------- accounting */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:4px 0 14px}
.tabs button,.tabs a.tablink{display:inline-block;border:0;background:none;padding:10px 14px;font:600 14px/1 var(--sans);color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"],.tabs a.tablink[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.cheat{columns:340px;column-gap:16px}
.cblock{break-inside:avoid;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin:0 0 16px;box-shadow:var(--shadow);position:relative}
.cblock h3{font:700 16px/1.3 var(--sans);margin:0 0 4px}
.cblock .ctags{display:flex;gap:6px;margin:6px 0 10px;flex-wrap:wrap}
.cbody{font:14.5px/1.55 var(--sans)}
.cbody p{margin:0 0 9px} .cbody ul,.cbody ol{margin:0 0 9px;padding-left:1.25em} .cbody li{margin-bottom:5px}
.cbody .warnline{border-left:3px solid var(--accent);padding:2px 0 2px 10px;color:var(--ink)}
.cbody .warnline b{color:var(--accent)}
.cbody .mynote{background:var(--note-bg);color:var(--note-ink);padding:8px 10px;border-radius:8px}
.veil{position:relative;cursor:pointer}
.veil>.cbody,.veil>.vbody,.veil>.cs-body{filter:blur(6px);user-select:none;pointer-events:none}
.veil::after{content:"Click to reveal";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:600 13px/1 var(--sans);padding:8px 12px;border-radius:999px;background:var(--ink);color:var(--surface)}
.ncard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 22px;box-shadow:var(--shadow)}
.ncard+.ncard{margin-top:14px}
.nsec{margin-top:12px}
.nsec .mini-label{display:block;margin-bottom:5px}
.nsec p{margin:0;font:15.5px/1.6 var(--serif)}
.nstatus{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.nstatus .btn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* ---------- ratios */
.rgrid{display:flex;flex-direction:column;gap:16px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow)}
.rhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rhead h3{font:700 19px/1.25 var(--sans);letter-spacing:-.01em}
.rformula{font:italic 16px/1.5 var(--serif);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:12px 0}
.rkv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 14px;font-size:14.5px;margin:8px 0 4px}
.rkv dt{color:var(--ink-3);font-size:13px;padding-top:2px}
.rkv dd{margin:0}
.hilo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
.hilo h4{font:700 12px/1.2 var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px;display:flex;align-items:center;gap:6px}
.hilo ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.hilo li{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13.5px;line-height:1.45}
.hilo li b{display:block;font-size:14px;margin-bottom:2px}
.hilo .ex{display:inline-block;margin-top:5px;font:600 12px/1.3 var(--sans);color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
.caveats{margin:14px 0 0;padding-left:1.2em;font-size:14px}
.caveats li{margin-bottom:6px}
.sound{margin-top:14px}
.strip-box{margin:14px 0 4px;padding:12px 14px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.strip-title{font:600 12.5px/1.2 var(--sans);color:var(--ink-2);margin-bottom:6px}
.strip{position:relative;margin:0 10px}
.slabels{position:relative}
.slabel{position:absolute;font:600 12px/16px var(--sans);color:var(--ink);white-space:nowrap;padding:0 5px;z-index:1}
.slabel small{font-weight:500;color:var(--ink-3)}
.sleader{position:absolute;width:1px;background:color-mix(in srgb,var(--ink-3) 55%,transparent)}
.strack{position:relative;height:8px;border-radius:4px;background:var(--g-0)}
.sband{position:absolute;top:-5px;bottom:-5px;border-radius:6px;background:color-mix(in srgb,var(--series-1) 16%,transparent);border:1px solid color-mix(in srgb,var(--series-1) 35%,transparent)}
.sref{position:absolute;top:-9px;bottom:-9px;width:2px;margin-left:-1px;background:var(--ink-3);border-radius:1px}
.sdot{position:absolute;top:50%;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;background:var(--series-1);border:0;box-shadow:0 0 0 2px var(--surface-2);padding:0}
.sdot::before{content:"";position:absolute;inset:-7px}
.saxis{position:relative;height:18px;margin-top:9px;font:11px/1 var(--sans);color:var(--ink-3)}
.saxis span{position:absolute;transform:translateX(-50%);font-variant-numeric:tabular-nums}
.scap{font-size:12px;color:var(--ink-3);margin-top:4px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.scap i{display:inline-block;width:14px;height:8px;border-radius:3px;vertical-align:middle;margin-right:4px;background:color-mix(in srgb,var(--series-1) 16%,transparent);border:1px solid color-mix(in srgb,var(--series-1) 35%,transparent)}
.scap i.ref{width:2px;height:12px;background:var(--ink-3);border:0}
.drillq{margin-top:10px;color:var(--ink-2);font:15px/1.5 var(--serif)}
.fam-chips{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- home */
.qa{display:flex;flex-wrap:wrap;gap:10px}
.qa .btn{padding:10px 14px}
.setcard h2{display:flex;align-items:center;gap:8px}
.setcard .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);margin-top:8px;flex-wrap:wrap;gap:6px}
.weak{display:grid;grid-template-columns:minmax(0,1fr) 110px 44px;gap:10px;align-items:center;padding:6px 0;font-size:13.5px;border-bottom:1px solid var(--line)}
.weak:last-child{border-bottom:0}
.weak .w-n{text-align:right;color:var(--ink-3);font-variant-numeric:tabular-nums;font-size:12.5px}
.miss{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.miss:last-child{border-bottom:0}
.miss:hover .mq{color:var(--accent)}
.mq{font:600 14px/1.4 var(--serif);color:var(--ink)}
.mn{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2)}
.badge .bi{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface-3);color:var(--ink-3)}
.badge.on .bi{background:var(--gold-soft);color:var(--gold);box-shadow:inset 0 0 0 1.5px var(--gold-2)}
.badge .bn{font:650 13px/1.25 var(--sans)}
.badge .bd{font-size:11.5px;color:var(--ink-3);line-height:1.35;margin-top:2px}
.badge:not(.on) .bn{color:var(--ink-2)}

/* ---------- toasts, tip, modal */
#toasts{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow-lg);font-size:13.5px;animation:tin .25s ease-out;max-width:360px}
.toast .tx{font:700 14px/1 var(--sans);color:var(--gold)}
.toast.badge-t .tx{color:var(--accent)}
.toast .tt{font-weight:600}
.toast .ts{color:var(--ink-3);font-size:12.5px}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.combo{position:fixed;left:50%;top:78px;transform:translateX(-50%);z-index:150;font:800 14px/1 var(--sans);letter-spacing:.04em;padding:8px 14px;border-radius:999px;background:var(--ink);color:var(--surface);box-shadow:var(--shadow-lg);animation:pop .9s ease-out forwards;pointer-events:none}
@keyframes pop{0%{opacity:0;transform:translate(-50%,6px) scale(.9)}15%{opacity:1;transform:translate(-50%,0) scale(1.05)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}
.tip{position:fixed;z-index:300;pointer-events:none;background:var(--ink);color:var(--surface);font:500 12.5px/1.35 var(--sans);padding:6px 9px;border-radius:7px;max-width:280px;box-shadow:var(--shadow-lg);opacity:0;transition:opacity .08s}
.tip.on{opacity:1}
.modal-bg{position:fixed;inset:0;z-index:250;background:rgba(10,10,10,.45);display:grid;place-items:center;padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border:1px solid var(--line-2);border-radius:18px;box-shadow:var(--shadow-lg);padding:26px 28px;max-width:440px;width:100%;text-align:center}
.modal .m-kicker{font:700 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.modal .m-title{font:750 28px/1.15 var(--sans);letter-spacing:-.02em;margin:10px 0 6px}
.modal p{color:var(--ink-2);margin:0 0 18px}
.modal.keys{text-align:left}
.modal.keys table{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:16px}
.modal.keys td{padding:7px 4px;border-bottom:1px solid var(--line)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:260}

/* ---------- data page */
.setting{display:grid;grid-template-columns:220px minmax(0,1fr);gap:10px 16px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.setting:last-child{border-bottom:0}
.setting label{font-weight:600;font-size:14px}
.setting .help{grid-column:2;font-size:12.5px;color:var(--ink-3);margin-top:-4px}
.setting .input{width:100%}
.danger{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.danger.armed{background:var(--accent);color:#fff}
pre.code{font:12.5px/1.5 var(--mono);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow:auto;max-height:220px}


.g-hero{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.build-tbl td:nth-child(2),.build-tbl td:nth-child(3){font-variant-numeric:tabular-nums}
.took{display:inline-flex;align-items:center;gap:6px;font:500 13px/1 var(--sans);color:var(--ink-3);padding:8px 6px}
.upc{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.upc:last-child{border-bottom:0}
.upc .d{color:var(--ink-3);font-variant-numeric:tabular-nums}
.upc .qq{font:600 14px/1.35 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width: 900px){ .g-hero{grid-template-columns:minmax(0,1fr)} .hide-sm{display:none} }


/* ---------- visual cheat sheet */
.cs-index{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin:0 0 18px}
.cs-index .cs-jump{display:flex;gap:10px;align-items:center;padding:9px 11px;border-radius:11px;border:1px solid var(--line);background:var(--surface);text-align:left;font:600 13.5px/1.25 var(--sans);color:var(--ink)}
.cs-index .cs-jump:hover{border-color:var(--ink-3)}
.cs-index small{display:block;font-weight:500;color:var(--ink-3);font-size:11.5px;margin-top:2px}
.cs-num{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--accent);color:#fff;font:700 13px/1 var(--sans)}
.cs-sec{margin:0 0 28px;scroll-margin-top:80px}
.cs-head{display:flex;gap:12px;align-items:flex-start;margin:6px 0 12px;padding-bottom:10px;border-bottom:2px solid var(--line)}
.cs-head .cs-num{width:34px;height:34px;font-size:15px;border-radius:10px}
.cs-head h2{font:700 20px/1.25 var(--sans);margin:2px 0 3px}
.cs-head p{margin:0;color:var(--ink-2);font-size:14px;max-width:820px}
.cs-notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.cs-note{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px 16px;box-shadow:var(--shadow);min-width:0;position:relative}
.cs-note.wide{grid-column:1/-1}
.cs-note>h3{font:700 15.5px/1.3 var(--sans);margin:0 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cs-note .cs-tags{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.cs-body{font:14px/1.55 var(--sans);min-width:0}
.cs-body>*:last-child{margin-bottom:0}
.cs-body p{margin:0 0 10px}
.cs-body ul,.cs-body ol{margin:0 0 10px;padding-left:1.2em}
.cs-body li{margin-bottom:4px}
.cs-body .t{margin:2px 0 10px}
.cs-body .formula{font-size:15px;margin:6px 0 10px}
.cs-body .pos{color:var(--ok);font-weight:700}
.cs-body .neg{color:var(--accent);font-weight:700}
.cs-body .mut{color:var(--ink-3)}
.cs-body .trap,.cs-body .mynote,.cs-body .upd,.cs-body .ind,.cs-body .key{padding:8px 11px;border-radius:9px;margin:0 0 10px;font-size:13.5px;line-height:1.5}
.cs-body .trap{background:var(--accent-soft);border-left:3px solid var(--accent)}
.cs-body .trap b:first-child{color:var(--accent)}
.cs-body .mynote{background:var(--note-bg);color:var(--note-ink);border-left:3px solid color-mix(in srgb,var(--note-ink) 45%,transparent)}
.cs-body .upd{background:var(--upd-bg);color:var(--upd-ink);border-left:3px solid var(--upd-line)}
.cs-body .ind{background:var(--ind-bg);color:var(--ind-ink);border-left:3px solid var(--ind-line)}
.cs-body .key{background:var(--surface-2);border:1px solid var(--line);font-weight:600}
/* flow chain */
.flow{display:flex;flex-wrap:wrap;gap:22px;align-items:stretch;margin:4px 0 12px}
.fstep{position:relative;flex:1 1 90px;min-width:84px;max-width:190px;border:1px solid var(--line-2);border-radius:10px;padding:7px 9px;background:var(--surface-2);display:flex;flex-direction:column;gap:2px}
.fstep:not(:last-child)::after{content:"";position:absolute;right:-17px;top:50%;width:12px;height:12px;border-top:2px solid var(--ink-3);border-right:2px solid var(--ink-3);transform:translateY(-50%) rotate(45deg)}
.fstep .fk{font:700 10.5px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.fstep b{font:700 14.5px/1.25 var(--sans)}
.fstep small{font-size:11.5px;color:var(--ink-3);line-height:1.3}
.fstep.hl{border-color:var(--series-1);background:color-mix(in srgb,var(--series-1) 12%,var(--surface))}
.fstep.hl2{border-color:var(--accent);background:var(--accent-soft)}
/* three statements side by side */
.fs3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:4px 0 10px}
.fsc{border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--surface)}
.fsh{font:700 11.5px/1 var(--sans);letter-spacing:.05em;text-transform:uppercase;padding:8px 10px;background:var(--surface-3);color:var(--ink-2)}
.fsr{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;border-top:1px solid var(--line);font-size:13px}
.fsr b{font-variant-numeric:tabular-nums;white-space:nowrap}
.fsr.tot{background:var(--surface-2);font-weight:700}
.balance{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;font:600 13px/1.3 var(--sans);padding:8px 10px;border:1px dashed var(--line-2);border-radius:9px;margin:0 0 10px}
.balance .eq{font-size:16px;color:var(--ink-3)}
/* formula cards */
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:4px 0 10px}
.fcard{border:1px solid var(--line-2);border-radius:10px;padding:9px 11px;background:var(--surface-2)}
.fname{font:700 12.5px/1.2 var(--sans);color:var(--ink-2);margin-bottom:4px}
.fx{font:italic 15px/1.4 var(--serif);color:var(--ink)}
.fnote{font-size:12px;color:var(--ink-3);margin-top:4px;line-height:1.4}
/* spectrum */
.spectrum{display:flex;gap:3px;margin:6px 0 2px}
.sp-seg{flex:var(--w) 1 0;min-width:0;padding:8px 9px;border-radius:8px;background:color-mix(in srgb,var(--series-1) calc(var(--t,14) * 1%),var(--surface));border:1px solid color-mix(in srgb,var(--series-1) 35%,transparent);font-size:12.5px;line-height:1.3}
.sp-seg b{display:block;font-size:13px}
.sp-seg small{color:var(--ink-2)}
.sp-axis{position:relative;height:16px;font:11px/1 var(--sans);color:var(--ink-3);margin:2px 0 12px}
.sp-axis span{position:absolute;left:calc(var(--x) * 1%);transform:translateX(-50%)}
.sp-axis span:first-child{transform:none}
.sp-axis span:last-child{transform:translateX(-100%)}
/* compare cards */
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:4px 0 10px}
.cmp-c{border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;background:var(--surface-2);min-width:0}
.cmp-c h4{font:700 13.5px/1.3 var(--sans);margin:0 0 6px}
.cmp-c ul{margin:0;padding-left:1.1em;font-size:13px}
.cmp-c li{margin-bottom:3px}
.cmp-c.a{border-top:3px solid var(--series-1)}
.cmp-c.b{border-top:3px solid var(--accent)}
.cmp-c.c{border-top:3px solid var(--gold-2)}
/* numbered steps */
ol.steps{list-style:none;padding:0;margin:4px 0 12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;counter-reset:st}
ol.steps li{counter-increment:st;position:relative;border:1px solid var(--line-2);border-radius:10px;padding:26px 9px 8px;background:var(--surface-2);font-size:12.5px;line-height:1.35;margin:0}
ol.steps li::before{content:counter(st);position:absolute;left:9px;top:6px;width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--surface);font:700 11px/18px var(--sans);text-align:center}
ol.steps li b{display:block;font-size:13px;margin-bottom:2px}
/* mini column chart */
.minichart{margin:6px 0 12px}
.mc-legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);margin-bottom:6px;flex-wrap:wrap}
.mc-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.mc-plot{display:flex;align-items:flex-end;gap:14px;height:150px;padding:0 4px;border-bottom:1px solid var(--line-2)}
.mc-group{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:3px;height:100%;position:relative}
.mc-col{width:min(22px,40%);height:calc(var(--v) / var(--max) * 120px);border-radius:4px 4px 0 0;position:relative}
.mc-col em{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font:600 10.5px/1.6 var(--sans);font-style:normal;color:var(--ink-2);white-space:nowrap}
.mc-x{position:absolute;top:100%;left:50%;transform:translateX(-50%);font:11px/1.9 var(--sans);color:var(--ink-3);white-space:nowrap}
.mc-xpad{height:20px}
.mc-a{background:var(--series-1)} .mc-b{background:var(--accent)} .mc-c{background:var(--gold-2)} .mc-n{background:var(--g-0)}
/* chips for impacts */
.kchips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.kchip{font:600 12.5px/1 var(--sans);padding:6px 9px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface-2)}
.kchip.up{border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.kchip.dn{border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
/* T-account */
.tacct{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;margin:4px 0 10px;font-size:13px}
.tacct>div{padding:0}
.tacct>div+div{border-left:2px solid var(--ink-3)}
.tacct .th{font:700 11.5px/1 var(--sans);letter-spacing:.05em;text-transform:uppercase;padding:8px 10px;background:var(--surface-3);color:var(--ink-2)}
.tacct .tr{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;border-top:1px solid var(--line)}
.tacct .tr b{font-variant-numeric:tabular-nums;white-space:nowrap}
/* inline svg figures */
figure.svgfig{margin:4px 0 12px}
figure.svgfig svg{display:block;width:100%;height:auto;max-width:100%;color:var(--ink)}
figure.svgfig figcaption{font-size:12px;color:var(--ink-3);margin-top:6px;line-height:1.4}
.s-line{stroke:currentColor;fill:none;stroke-width:1.6}
.s-mline{stroke:var(--ink-3);fill:none;stroke-width:1.4}
.s-grid{stroke:var(--line);fill:none;stroke-width:1}
.s-box{fill:var(--surface);stroke:var(--line-2);stroke-width:1.4}
.s-box2{fill:var(--surface-2);stroke:var(--line-2);stroke-width:1.4}
.s-boxa{fill:color-mix(in srgb,var(--series-1) 14%,var(--surface));stroke:var(--series-1);stroke-width:1.6}
.s-boxb{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.s-boxg{fill:var(--gold-soft);stroke:var(--gold-2);stroke-width:1.6}
.s-fa{fill:var(--series-1)} .s-fb{fill:var(--accent)} .s-fg{fill:var(--gold-2)} .s-fn{fill:var(--g-0)} .s-fink{fill:currentColor}
.s-la{stroke:var(--series-1);fill:none;stroke-width:2} .s-lb{stroke:var(--accent);fill:none;stroke-width:2}
.s-t{font:500 12px var(--sans);fill:currentColor}
.s-ts{font:500 11px var(--sans);fill:var(--ink-3)}
.s-tb{font:700 12.5px var(--sans);fill:currentColor}
.s-ta{font:700 12px var(--sans);fill:var(--series-1)} .s-tr{font:700 12px var(--sans);fill:var(--accent)}
@media (max-width: 900px){
  .cs-notes{grid-template-columns:minmax(0,1fr)}
  .fs3{grid-template-columns:minmax(0,1fr)}
  .flow{gap:18px}
  .fstep{max-width:none;flex:1 1 40%}
  .fstep:not(:last-child)::after{right:-14px;width:9px;height:9px}
}

/* ---------- responsive */
@media (max-width: 1080px){
  .ans-grid{grid-template-columns:minmax(0,1fr)}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width: 900px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 1fr}
  .topbar{position:sticky;top:0;height:56px;padding:0 12px;gap:8px}
  .sidenav{position:sticky;top:56px;z-index:35;height:auto;flex-direction:row;overflow-x:auto;padding:8px 10px;border-right:0;border-bottom:1px solid var(--line);gap:4px;scrollbar-width:none}
  .sidenav::-webkit-scrollbar{display:none}
  .nav-a{white-space:nowrap;padding:8px 10px}
  .nav-a .cnt{display:none}
  .nav-sep,.nav-foot{display:none}
  main{padding:18px 16px 70px}
  .filters{position:static;backdrop-filter:none;background:transparent;padding:10px 0 12px}
  .frow .select{flex:1 1 42%;max-width:none}
  .frow .search{flex:1 1 100%;max-width:none}
  .rinfo{margin-left:0;width:100%;justify-content:space-between}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .tb-stat small,.pill-sample,.lvl-name,.lvl-xp{display:none}
  .lvl{padding:4px 8px 4px 4px;flex:1 1 120px;gap:8px}
  .topbar{gap:8px;padding:0 10px}
  .lvl-txt{display:flex}
  .brow{grid-template-columns:minmax(90px,130px) minmax(0,1fr) 52px}
  .brow .bs{display:none}
  .hilo{grid-template-columns:minmax(0,1fr)}
  .setting{grid-template-columns:minmax(0,1fr)}
  .setting .help{grid-column:1}
  .qcard,.qcard.focus{padding:16px 16px 18px}
  .qcard.focus .qtext{font-size:19px}
  .rkv{grid-template-columns:minmax(0,1fr)}
  .rkv dt{padding-top:6px}
  .hero .h-val{font-size:48px}
  .kbd-hint{display:none}
}
@media (max-width: 480px){
  .brand-name{display:none}
  .tb-stat{padding:6px 2px}
  h1{font-size:22px}
  .gbtn kbd{display:none}
  .grade-row{display:grid;grid-template-columns:1fr 1fr}
}

/* plan, today and coverage */
details.cov{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:14px 0 0;padding:0}
details.cov>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 16px;font:600 14px/1.3 var(--sans)}
details.cov>summary::-webkit-details-marker{display:none}
details.cov>summary .cov-sum{font-weight:400;color:var(--ink-3);font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.cov>summary:after{content:"";width:8px;height:8px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg);margin-left:auto;flex:none}
details.cov[open]>summary:after{transform:rotate(-135deg)}
details.cov[open]>summary{border-bottom:1px solid var(--line)}
details.cov>div{padding:12px 16px 16px}
@media (max-width:700px){ details.cov>summary .cov-sum{display:none} }
.planbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;padding:10px 14px;border:1px solid var(--accent-line, var(--line-2));border-radius:12px;background:var(--surface-2);font-size:13.5px}
.planbar .i{color:var(--ink-2);flex:none}
.planbar button{margin-left:auto}
.today{border-color:var(--line-2)}
.today-head{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.today-head h2{margin:4px 0 0}
.today-blocks{margin-top:14px;display:grid;gap:10px}
.bigring{width:64px;height:64px;flex:none}
.bigring .trk{fill:none;stroke:var(--surface-3);stroke-width:6}
.bigring .val{fill:none;stroke:var(--brand);stroke-width:6;stroke-linecap:round;transform:rotate(-90deg);transform-origin:32px 32px}
.bigring text{font:600 13px var(--sans);fill:var(--ink)}
.pblock{display:flex;gap:14px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.pb-main{flex:1;min-width:0}
.pb-t{display:flex;align-items:center;gap:8px;font-size:14px;flex-wrap:wrap}
.pb-t .i{color:var(--ink-3)}
.pb-t .muted{font-size:12.5px}
.pb-bar{height:6px;border-radius:4px;background:var(--surface-3);margin:8px 0 6px;overflow:hidden}
.pb-bar span{display:block;height:100%;background:var(--g-N);border-radius:4px}
.pb-sub{font-size:12px;color:var(--ink-3)}
.pb-rev{margin-top:12px}
.pb-acts{display:flex;flex-direction:column;gap:6px;flex:none}
.g2 .dp-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
.rev-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.rev-chip{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 11px;font:500 13px/1.25 var(--sans);color:var(--ink);display:block}
.rev-chip small{display:block;color:var(--ink-3);font-size:11.5px;font-weight:400;margin-top:2px}
.rev-chip:hover{border-color:var(--line-2);background:var(--surface-2)}
.plan-days{display:grid;gap:10px;margin-top:16px}
.pday{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.pday.today{border-color:var(--brand)}
.pday-head{width:100%;display:flex;align-items:center;gap:14px;padding:13px 16px;background:none;border:0;font:500 14px var(--sans);color:var(--ink);text-align:left}
.pday-head:hover{background:var(--surface-2)}
.pd-n{font-weight:650;min-width:52px}
.pd-date{color:var(--ink-2);min-width:130px;font-size:13px}
.pd-date b{color:var(--brand)}
.pd-bar{flex:1;min-width:60px;height:6px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.pd-bar span{display:block;height:100%;background:var(--g-N)}
.pd-n2{font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink-2);min-width:56px;text-align:right}
.pd-min{font-size:12px;color:var(--ink-3);min-width:56px;text-align:right}
.pd-chev{color:var(--ink-3);transform:rotate(90deg);flex:none}
.pday.open .pd-chev{transform:rotate(-90deg)}
.pday.done .pd-n{color:var(--ink-3)}
.pday-body{padding:0 16px 16px;display:grid;gap:10px}
.covgrid{display:grid;gap:9px}
.covrow{display:grid;grid-template-columns:minmax(120px,1.1fr) minmax(70px,1fr) auto;gap:10px;align-items:center;font-size:13px}
.covrow .cv-n small{color:var(--ink-3);font-size:11px}
.covrow .cv-c{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:12.5px}
.covgrid+.legend{margin-top:12px}
@media (max-width:700px){ .pday-head{flex-wrap:wrap;gap:8px} .pd-date{min-width:0;flex:1} .pd-bar{order:9;flex-basis:100%} .pblock{flex-wrap:wrap} }

/* revision marks and forgotten highlights */
.rv-list{display:grid;gap:8px;margin-top:6px}
.rv-item{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px 8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.rv-item.done{background:var(--surface-2)}
.rv-item.done .rv-open span{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1px}
.rv-item.again{border-color:var(--g-P)}
.rv-open{flex:1;min-width:160px;text-align:left;background:none;border:0;padding:2px 0;font:500 13.5px/1.3 var(--sans);color:var(--ink)}
.rv-open small{display:block;color:var(--ink-3);font-size:11.5px;font-weight:400;margin-top:2px}
.rv-open:hover span{text-decoration:underline}
.rv-acts{display:flex;gap:6px;flex-wrap:wrap}
.cs-head .rv-acts{margin-left:auto;align-self:center}
.rv-b{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:6px 10px;font:500 12.5px/1 var(--sans);color:var(--ink-2)}
.rv-b svg{width:14px;height:14px;flex:none}
.rv-b:hover{background:var(--surface-2)}
.rv-b.ok[aria-pressed="true"]{background:var(--g-N);border-color:var(--g-N);color:var(--g-N-ink)}
.rv-b.again[aria-pressed="true"]{background:var(--g-P);border-color:var(--g-P);color:var(--g-P-ink)}
em.xp{font-style:normal;font:600 11px/1 var(--sans);color:var(--brand);background:var(--surface-3);border-radius:6px;padding:3px 5px;margin-left:4px;white-space:nowrap}
.rv-b[aria-pressed="true"] em.xp,.gbtn.on em.xp{background:rgba(255,255,255,.25);color:inherit}
.gbtn em.xp{margin-left:auto;margin-right:6px}
mark.fg{background:#ffe27a;color:#1a1a1a;border-radius:3px;padding:0 1px;cursor:pointer;box-shadow:0 0 0 1px rgba(160,120,0,.25)}
:root[data-theme="dark"] mark.fg{background:#7a5f00;color:#fff}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) mark.fg{background:#7a5f00;color:#fff} }
.forgot{margin-top:14px}
.forgot-tip{display:flex;align-items:center;gap:8px;margin:0;font-size:13px;color:var(--ink-3)}
.forgot-tip .i{flex:none}
.forgot-box{border:1px dashed var(--line-2);border-radius:12px;padding:10px 12px;background:var(--surface-2)}
.forgot-box ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}
.forgot-box li{display:flex;gap:8px;align-items:flex-start;font-size:13.5px}
mark.forgot-m{background:#ffe27a;color:#1a1a1a;border-radius:3px;padding:1px 3px}
:root[data-theme="dark"] mark.forgot-m{background:#7a5f00;color:#fff}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) mark.forgot-m{background:#7a5f00;color:#fff} }
.forgot-x{border:0;background:none;color:var(--ink-3);font-size:18px;line-height:1;padding:0 4px;margin-left:auto}
.forgot-x:hover{color:var(--ink)}
@media print{ mark.fg{background:none;box-shadow:none;text-decoration:underline} }

/* level ladder */
.ladder{padding:18px 20px 14px;background:linear-gradient(135deg,var(--surface) 0%,var(--gold-soft) 140%)}
.ld-top{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ld-badge{width:64px;height:64px;border-radius:50%;flex:none;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,var(--gold-2),var(--gold));box-shadow:0 0 0 4px var(--gold-soft),0 6px 18px rgba(0,0,0,.12)}
.ld-badge span{font:800 24px/1 var(--sans);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.ld-main{flex:1;min-width:220px}
.ld-title{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.ld-title b{font:700 22px/1.1 var(--sans)}
.ld-bar{position:relative;height:18px;border-radius:10px;background:var(--surface-3);overflow:hidden;margin:10px 0 7px;box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}
.ld-bar>span{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,var(--gold),var(--gold-2));box-shadow:0 0 12px var(--gold-2);transition:width .6s ease}
.ld-bar em{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 11.5px/1 var(--sans);font-style:normal;color:var(--ink);letter-spacing:.02em}
.ld-sub{font-size:13px;color:var(--ink-2)}
.ld-stats{display:flex;gap:18px;flex-wrap:wrap}
.ld-stats div{display:flex;flex-direction:column;gap:3px;min-width:74px}
.ld-stats b{font:700 18px/1.1 var(--sans);color:var(--ink)}
.ld-stats span{font-size:11.5px;color:var(--ink-3)}
.ld-track{position:relative;height:58px;margin:18px 14px 2px}
.ld-line{position:absolute;left:0;right:0;top:11px;height:4px;border-radius:3px;background:var(--surface-3)}
.ld-line span{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--gold-2))}
.ld-node{position:absolute;top:0;left:calc(var(--x) * 1%);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
.ld-node i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 11px/1 var(--sans);font-style:normal;background:var(--surface);color:var(--ink-3);border:2px solid var(--line-2)}
.ld-node.on i{background:var(--gold);border-color:var(--gold);color:#fff}
.ld-node.cur i{transform:scale(1.25);box-shadow:0 0 0 4px var(--gold-soft)}
.ld-node span{font-size:10.5px;color:var(--ink-3);white-space:nowrap}
.ld-node.on span{color:var(--ink-2)} .ld-node.cur span{color:var(--ink);font-weight:700}
.ld-node:first-of-type{transform:none} .ld-node:first-of-type span{align-self:flex-start}
.ld-you{position:absolute;top:4px;left:calc(var(--x) * 1%);width:4px;height:18px;margin-left:-2px;border-radius:2px;background:var(--ink)}
.ld-foot{font-size:11.5px;color:var(--ink-3);margin-top:6px;border-top:1px dashed var(--line);padding-top:8px}
@media (max-width:700px){ .ld-node span{display:none} .ld-track{height:34px} .ld-stats{width:100%;justify-content:space-between} }
.btn.nextday{border-color:var(--brand);color:var(--brand)}
.linkbtn{background:none;border:0;padding:0;color:var(--brand);text-decoration:underline;font:inherit;cursor:pointer}
.pd-ok{color:var(--g-N);font-weight:600} .pd-late{color:var(--g-M);font-weight:600}
.pday.past:not(.done){border-color:var(--g-P)}
/* ratio cheat sheet */
.rc-wrap{overflow-x:auto}
table.rcheat{width:100%;border-collapse:collapse;font-size:12.5px;line-height:1.35}

    if ((src.noteAt || '') > (cur.noteAt || '')) { cur.note = src.note; cur.noteAt = src.noteAt; }

    case 'plan-start': planStart(set, +el.getAttribute('data-d')); break;
    case 'set-day': setDay(+el.getAttribute('data-d')); break;
    case 'next-day': var P = planInfo(); if (P.cur < P.n) { var T0 = planToday(), left = T0 ? T0.total - T0.done : 0; S.profile.planDay = P.cur + 1; ui('plan').open = P.cur + 1; save(); toast('Day ' + (P.cur + 1) + ' started', left ? left + ' items stay in Day ' + P.cur + '. Open the plan to finish them later' : ''); route(); } break;
    case 'quick': if (v === 'rv') { ui('rv').mode = 'focus'; ui('rv').idx = 0; save(); go('review'); } else if (v === 'rand') { resetFiltersState('cb'); var c = ui('cb'); c.status = 'none'; c.sort = 'shuffle'; c.seed = Math.floor(Math.random() * 1e6); c.mode = 'focus'; c.idx = 0; save(); go('cb'); } break;
    case 'rev-mark': markRev(el.getAttribute('data-key'), v, el.getAttribute('data-kind')); break;
    case 'cc-self': ui('cc').self = !ui('cc').self; session.veil = {}; save(); renderConcepts(); break;
    case 'veil': session.veil[id] = true; renderConcepts(); break;
  }
});
document.addEventListener('change', function(e){
  var t = e.target;
  if (t.getAttribute('data-act') === 'task') { toggleTask(t.getAttribute('data-id'), t.getAttribute('data-kind'), t.checked); var r = currentRoute(); if (r === 'plan' || r === 'home') route(true); return; }
  if (t.id === 'importfile' && t.files && t.files[0]) { doImport(t.files[0]); t.value = ''; return; }
  if (t.hasAttribute('data-setting')) { settingChange(t); if (t.getAttribute('data-setting') === 'planDay' || t.getAttribute('data-setting') === 'planStart') renderData(); return; }
  var f = t.getAttribute('data-f'), set = t.getAttribute('data-set');
  if (f && set && t.tagName === 'SELECT') { var st = ui(set); st[f] = t.value; st.idx = 0; st.shown = 20; save(); $('#filters').innerHTML = filtersHtml(set); renderResults(set); }
});
var searchDeb = debounce(function(set, v){ var st = ui(set); st.search = v; st.idx = 0; st.shown = 20; save(); renderResults(set); }, 180);
var mkDeb = debounce(function(v){ ui('mk').q = v; save(); renderMistakeBody(); }, 180);
document.addEventListener('input', function(e){
  var t = e.target;
  if (t.matches('textarea[data-act="note"]')) { var c = t.parentNode.querySelector('.count'); if (c) c.textContent = t.value.length + '/400'; noteSave(t.getAttribute('data-id'), t.value); return; }
  var f = t.getAttribute('data-f');
  if (f === 'search') searchDeb(t.getAttribute('data-set'), t.value);
  else if (f === 'mk-search') mkDeb(t.value);
});
document.addEventListener('keydown', function(e){
  var t = e.target, typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT');
  if (e.key === 'Escape') { if (typing) t.blur(); closeModal(); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '?') { showKeys(); return; }
  var r = currentRoute(), ctx = r === 'review' ? 'rv' : r, id = session.focusId;
  var inFocus = (ctx === 'rq' || ctx === 'cb' || ctx === 'rv' || ctx === 'co') && ui(ctx).mode === 'focus' && id && $('#card-' + id);
  if (!inFocus) return;
  if (e.key === ' ') { e.preventDefault(); toggleReveal(id); }
  else if (e.key === 'ArrowRight') move(ctx, 1);
  else if (e.key === 'ArrowLeft') move(ctx, -1);
  else if (e.key === 'f' || e.key === 'F') toggleFlag(id);
  else if (e.key === 't' || e.key === 'T') toggleTimer(id);
  else if (e.key === 'n' || e.key === 'N') { var ta = $('#card-' + id + ' textarea'); if (ta) { e.preventDefault(); ta.focus(); } }
  else if (session.revealed[id] && isCase(id)) { var map = {'4':'N','3':'U','2':'P','1':'M','0':'X'}; if (map[e.key]) grade(id, map[e.key]); }
});

route();
})();
</script>
