<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a working desk. Live progress header, sticky tab bar, one working column; casebook cards in a grid; PDF viewer as a full-screen sheet. */
:root {
  --bg: #f4f6fb;
  --surface: #ffffff;
  --ink: #151a2d;
  --muted: #5b6380;
  --line: #dde2ee;
  --accent: #2a4bd7;
  --accent-soft: #e7ecff;
  --mark: #f2b705;
  --mark-ink: #3d2f00;
  --good: #16784e;
  --good-soft: #def3e8;
  --warn: #b4501b;
  --warn-soft: #fbe9df;
  --sheet: #e9ecf4;
  --f-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1120; --surface: #161a2b; --ink: #e7eaf6; --muted: #9ba3c2; --line: #29304a;
    --accent: #93a6ff; --accent-soft: #222a50; --mark: #e2bb3b; --mark-ink: #1b1400;
    --good: #62d39d; --good-soft: #15321f; --warn: #f0a070; --warn-soft: #3a2418; --sheet: #0a0c17; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1120; --surface: #161a2b; --ink: #e7eaf6; --muted: #9ba3c2; --line: #29304a;
  --accent: #93a6ff; --accent-soft: #222a50; --mark: #e2bb3b; --mark-ink: #1b1400;
  --good: #62d39d; --good-soft: #15321f; --warn: #f0a070; --warn-soft: #3a2418; --sheet: #0a0c17; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; }
h1, h2, h3, h4 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.2; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { padding-block: 28px 18px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
header.top h1 { font-size: clamp(28px, 5vw, 40px); font-weight: 700; margin-top: 6px; }
header.top p.lede { color: var(--muted); max-width: 66ch; margin: 8px 0 0; }
.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-top: 20px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.stat .k { font-size: 11px; color: var(--muted); font-family: var(--f-mono); letter-spacing: .04em; text-transform: uppercase; }
.stat .v { font-family: var(--f-display); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 13px; color: var(--muted); font-weight: 500; }
.stat .s { font-size: 12px; color: var(--muted); margin-top: 4px; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 6px; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s; }
.stat input[type=date] { font: inherit; font-size: 13px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; margin-top: 4px; max-width: 100%; }
.sync { font-family: var(--f-mono); font-size: 11px; color: var(--muted); margin-top: 10px; }

nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
nav.tabs .wrap { display: flex; gap: 2px; overflow-x: auto; }
nav.tabs button { background: none; border: 0; padding: 12px 12px; cursor: pointer; font-family: var(--f-display); font-weight: 600; font-size: 15px; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
nav.tabs button[aria-selected=true] { color: var(--ink); border-bottom-color: var(--accent); }

main { padding-block: 22px 60px; }
.section-head { margin-bottom: 14px; }
.section-head h2 { font-size: 24px; }
.section-head p { color: var(--muted); margin: 6px 0 0; max-width: 78ch; }
.phase { margin-top: 26px; }
.phase:first-child { margin-top: 0; }
.phase > h3, .kicker { font-size: 13px; font-family: var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; margin-bottom: 10px; }

details.day { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; }
details.day.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
details.day > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 14px; align-items: center; }
details.day > summary::-webkit-details-marker { display: none; }
.daynum { font-family: var(--f-display); font-weight: 700; font-size: 22px; width: 44px; height: 44px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-variant-numeric: tabular-nums; }
details.day.complete .daynum { background: var(--good-soft); color: var(--good); }
.daytitle { min-width: 0; }
.daytitle h3 { font-size: 18px; }
.daytitle .meta { font-size: 13px; color: var(--muted); }
.pill { font-family: var(--f-mono); font-size: 12px; padding: 3px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill.today { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.pill.done { background: var(--good-soft); border-color: transparent; color: var(--good); }
.daybody { padding: 0 16px 16px; display: grid; gap: 14px; }
.daybody .focus { color: var(--muted); margin: 0; max-width: 78ch; }
.block h4 { font-family: var(--f-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; margin: 0 0 6px; }
.tip { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; font-size: 14px; }

.row { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 10px; align-items: start; padding: 9px 0; border-top: 1px solid var(--line); }
.block .row:first-of-type, .cat .row:first-of-type { border-top: 0; }
.check { appearance: none; width: 20px; height: 20px; border: 2px solid var(--muted); border-radius: 5px; margin: 2px 0 0; cursor: pointer; display: grid; place-items: center; background: var(--surface); flex: none; }
.check:checked { background: var(--good); border-color: var(--good); }
.check:checked::after { content: ""; width: 5px; height: 10px; border: solid var(--surface); border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px); }
.row .txt { min-width: 0; }
.row.is-done .txt > .q { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.row .q { font-weight: 500; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; align-items: center; }
.tag { font-family: var(--f-mono); font-size: 11px; padding: 1px 7px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.tag.plain { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.tag.rep { background: var(--good-soft); color: var(--good); }
.tag.gd { background: var(--warn-soft); color: var(--warn); }
.tag.co { background: var(--ink); color: var(--bg); }
.srcl { font-size: 12px; color: var(--muted); }
.actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.icon-btn { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; font-size: 12px; cursor: pointer; color: var(--muted); white-space: nowrap; text-decoration: none; display: inline-block; }
.icon-btn:hover { color: var(--ink); }
.icon-btn[aria-pressed=true] { background: var(--mark); border-color: var(--mark); color: var(--mark-ink); font-weight: 600; }
.icon-btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.more { margin-top: 8px; display: grid; gap: 8px; }
.hint { font-size: 14px; background: var(--bg); border-left: 3px solid var(--accent); padding: 8px 10px; border-radius: 0 6px 6px 0; }
textarea.note { width: 100%; min-height: 70px; font: inherit; font-size: 14px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 8px; resize: vertical; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
.chip { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
.chip[aria-pressed=true] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .n { font-family: var(--f-mono); font-size: 11px; opacity: .7; margin-left: 4px; }
input.search { font: inherit; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; flex: 1 1 220px; }
select.sel { font: inherit; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; max-width: 100%; }
.cat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 6px; margin-bottom: 14px; }
.cat > header { margin-bottom: 4px; }
.cat > header h3 { font-size: 19px; }
.cat > header p { margin: 2px 0 0; color: var(--muted); font-size: 14px; max-width: 76ch; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 13px; color: var(--muted); margin-bottom: 14px; align-items: center; }

.co-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; margin-bottom: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
.panel h3 { font-size: 18px; margin-bottom: 6px; }
.panel ol, .panel ul { margin: 6px 0 0; padding-left: 20px; font-size: 14px; }
.panel li { margin: 3px 0; }
.panel p { font-size: 14px; margin: 6px 0 0; }
.cotabs { display: flex; gap: 8px; margin-bottom: 14px; }
.cotabs button { font-family: var(--f-display); font-weight: 700; font-size: 18px; padding: 8px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.cotabs button[aria-pressed=true] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.cbgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.case { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; align-content: start; min-width: 0; cursor: pointer; text-align: left; width: 100%; }
.case:hover { border-color: var(--accent); }
.case.is-done { border-color: var(--good); }
.case .top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.case .seg { font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; padding: 2px 7px; border-radius: 4px; font-weight: 500; background: var(--sc-bg); color: var(--sc-fg); }
.case h4 { font-size: 16px; }
.case .prompt { font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.case .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); font-family: var(--f-mono); flex-wrap: wrap; }
.stars { color: var(--mark); letter-spacing: 1px; font-size: 14px; white-space: nowrap; }
.stars .off { color: var(--line); }
.readlist { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.readlist button { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
.readlist button span { font-family: var(--f-mono); font-size: 11px; color: var(--muted); margin-left: 6px; }
:root { --s-design: #2a4bd7; --s-rca: #b3261e; --s-guess: #16784e; --s-improve: #6a38b8; --s-metrics: #8a6100; --s-pricing: #0d6a75; --s-gtm: #b4501b; --s-strategy: #3d4663; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --s-design: #93a6ff; --s-rca: #ff8a80; --s-guess: #62d39d; --s-improve: #c6a4ff; --s-metrics: #f2c14e; --s-pricing: #6fd3de; --s-gtm: #f0a070; --s-strategy: #b8c0dc; } }
:root[data-theme="dark"] { --s-design: #93a6ff; --s-rca: #ff8a80; --s-guess: #62d39d; --s-improve: #c6a4ff; --s-metrics: #f2c14e; --s-pricing: #6fd3de; --s-gtm: #f0a070; --s-strategy: #b8c0dc; }
.seg-design { --sc-fg: var(--s-design); } .seg-rca { --sc-fg: var(--s-rca); } .seg-guess { --sc-fg: var(--s-guess); } .seg-improve { --sc-fg: var(--s-improve); }
.seg-metrics { --sc-fg: var(--s-metrics); } .seg-pricing { --sc-fg: var(--s-pricing); } .seg-gtm { --sc-fg: var(--s-gtm); } .seg-strategy { --sc-fg: var(--s-strategy); }
.case .seg { background: color-mix(in srgb, var(--sc-fg) 14%, transparent); }

.viewer { position: fixed; inset: 0; z-index: 50; background: var(--sheet); display: grid; grid-template-rows: auto minmax(0,1fr); padding-top: env(safe-area-inset-top, 0px); }
.vbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.vbar h3 { font-size: 17px; min-width: 0; }
.vbar .sub { font-size: 12px; color: var(--muted); font-family: var(--f-mono); }
.vctl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.vctl .pg { font-family: var(--f-mono); font-size: 13px; min-width: 88px; text-align: center; font-variant-numeric: tabular-nums; }
.vbody { display: grid; grid-template-columns: minmax(0,1fr) 320px; min-height: 0; }
.canvaswrap { overflow: auto; padding: 16px; min-width: 0; display: flex; justify-content: center; align-items: flex-start; }
.canvaswrap canvas { background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.18); max-width: none; }
.vmsg { color: var(--muted); padding: 40px 16px; text-align: center; max-width: 50ch; }
.vside { background: var(--surface); border-left: 1px solid var(--line); padding: 16px; overflow: auto; display: grid; gap: 14px; align-content: start; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.rate { display: flex; gap: 4px; }
.rate button { background: none; border: 0; font-size: 28px; line-height: 1; cursor: pointer; color: var(--line); padding: 2px; }
.rate button.on { color: var(--mark); }
.ratehelp { font-size: 12px; color: var(--muted); }
@media (max-width: 860px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .co-grid { grid-template-columns: minmax(0,1fr); }
  .row { grid-template-columns: auto minmax(0,1fr); }
  .row .actions { grid-column: 2; justify-content: flex-start; }
  .vbody { grid-template-columns: minmax(0,1fr); grid-template-rows: minmax(0,1fr) auto; }
  .vside { border-left: 0; border-top: 1px solid var(--line); max-height: 42vh; }
}
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>

<header class="top wrap">
  <div class="eyebrow">APM / PM-1 interview prep · Juspay &amp; Swiggy focus</div>
  <h1>ProductPrep Tracker</h1>
  <p class="lede">Real questions candidates reported, the IIMA and IIMB (Sigma) casebooks with every case one click away, and a 10-day plan that ties them together. Tick, rate and take notes as you go.</p>
  <div class="stats" id="stats"></div>
  <div class="sync" id="sync">Saving on this device</div>
</header>

<nav class="tabs" aria-label="Sections">
  <div class="wrap" role="tablist">
    <button role="tab" data-tab="plan" aria-selected="true">Schedule</button>
    <button role="tab" data-tab="bank" aria-selected="false">Real questions</button>
    <button role="tab" data-tab="focus" aria-selected="false">Juspay &amp; Swiggy</button>
    <button role="tab" data-tab="cases" aria-selected="false">Casebooks</button>
    <button role="tab" data-tab="concepts" aria-selected="false">Concepts</button>
    <button role="tab" data-tab="sources" aria-selected="false">Sources</button>
  </div>
</nav>

<main class="wrap" id="main"></main>
<div id="viewerRoot"></div>

<script>

const SRC = {

  htc_fk: ["Hacking the Case: Flipkart case interview", "https://www.hackingthecaseinterview.com/pages/flipkart-case-interview"],

/* ============ Concepts ============ */
const CONCEPTS = [
  { g: "How the interview works", items: [
    { id: "c-rounds", name: "The APM / PM-1 loop in India", what: "Most loops: recruiter screen, then 2 to 4 case rounds (design or improvement, RCA, guesstimate, metrics), a behavioral or hiring-manager round, sometimes a take-home. Juspay adds a data problem and, in some PM loops, coding. Swiggy adds marketplace cases.", ex: "Freshers are judged on structure, communication, curiosity and user empathy more than domain depth." },
    { id: "c-approach", name: "How to run any case", what: "A rhythm that works for every case type.", list: ["Repeat the question, ask 2 to 3 clarifying questions","Say your approach in one line","Ask for a minute to think","Go step by step and check in","Make choices and state assumptions","Summarize: recommendation, why, risks, next steps"] }
  ]},
  { g: "Product sense", items: [
    { id: "c-circles", name: "CIRCLES", ref: ["iima", 23], what: "Comprehend, Identify customers, Report needs, Cut through prioritization, List solutions, Evaluate trade-offs, Summarize. A checklist, not a script.", ex: "Timing for 30 minutes: clarify 3, users 5, pains 5, solutions 8, prioritize 4, metrics 3, summary 2." },
    { id: "c-persona", name: "Personas, JTBD, journey maps", ref: ["iima", 13], what: "Segment users by needs and context, not demographics alone. Jobs to be done asks what progress the user wants. Journey maps show where the pain sits." },
    { id: "c-prior", name: "Prioritization: RICE, value vs effort, Kano, MoSCoW, ICE", ref: ["iima", 26], what: "Tools to pick what to build. In an interview, a small value vs effort table for 3 ideas is usually enough." },
    { id: "c-mvp", name: "PRD, MVP, user stories", ref: ["iima", 17], what: "A PRD states problem, users, goals, requirements, metrics. An MVP tests your riskiest assumption. User story: As a [user], I want [action] so that [benefit]." },
    { id: "c-market", name: "Marketplaces (for Swiggy)", ref: ["iima", 111], what: "Swiggy is a three-sided marketplace: customers, restaurants and stores, delivery partners. Every change helps one side and costs another. Always say which side you optimize and what you protect.", ex: "Contribution per order = commission + delivery fee + ads - rider cost - discounts." }
  ]},
  { g: "Metrics & analytics", items: [
    { id: "c-nsm", name: "North star, HEART, AARRR", ref: ["iima", 43], what: "North star: the one metric that captures value delivered. HEART: happiness, engagement, adoption, retention, task success. AARRR: acquisition, activation, retention, referral, revenue." },
    { id: "c-guard", name: "Counter metrics and guardrails", ref: ["iima", 49], what: "Metrics that must not get worse while you chase the goal (cancellations, payment success rate, complaints)." },
    { id: "c-ab", name: "A/B tests and evals", ref: ["iima", 54], what: "Hypothesis, control vs variant, primary metric, significance, a full-week duration, novelty effect. Marketplaces often test by city or time slot." },
    { id: "c-pr", name: "Precision, recall, thresholds", ref: ["iima", 57], what: "Precision: of what we flagged, how much was right. Recall: of what was there, how much we caught. Fraud detection lives on this trade-off (Juspay)." }
  ]},
  { g: "RCA & guesstimates", items: [
    { id: "c-rca", name: "RCA playbook", ref: ["sigma", 63], what: "Find why a metric moved.", list: ["Clarify the metric, size, time, sudden or gradual","Check data and tracking","Internal: releases, pricing, ops, outages","External: competitors, seasonality, weather, regulation, partner downtime","Segment: platform, version, geo, user type, payment method","Walk the funnel or break the metric into a formula","Form hypotheses, validate, fix"] },
    { id: "c-guess", name: "Guesstimate playbook", ref: ["iima", 202], what: "Clarify scope, pick top-down or bottom-up, segment, round, calculate, sense-check with a second method, give a range. Rough anchors below; check the latest figures.", list: ["India population ~1.45B, households ~320M","Internet users ~900M, smartphone users ~650M","Urban share ~35%","UPI ~20B transactions a month (2025)"] }
  ]},
  { g: "Payments (for Juspay)", items: [
    { id: "c-pay", name: "Payments 101", ref: ["iima", 150], what: "Customer, merchant, payment gateway or aggregator, acquiring bank, card network or NPCI (UPI), issuing bank. Know MDR, settlement, refunds, chargebacks, 3DS/OTP, tokenization, recurring mandates (UPI Autopay, e-mandates).", ex: "Success rate = successful payments / attempts. It drops with bank downtime, OTP failures, timeouts and strict fraud rules." },
    { id: "c-upi", name: "How UPI works", what: "The payer app (TPAP) talks to its PSP bank, which sends the request to NPCI's switch; NPCI gets the issuer bank to debit and the payee's bank to credit, then confirms back. The VPA is the address. Intent and collect are the two flows.", ex: "Common failures: wrong PIN, bank downtime, timeouts, debit without credit (reversed later)." },
    { id: "c-orch", name: "Payment orchestration and Juspay's products", what: "Orchestration routes each payment across several gateways to raise success rates and cut cost. Juspay's lines include Express Checkout / HyperSDK (checkout), Hyperswitch (open-source payments switch), a UPI stack for banks, and Smart Gateway with HDFC Bank.", ex: "Check Juspay's site before interviews, since product names change." }
  ]},
  { g: "Technical & AI", items: [
    { id: "c-web", name: "Web, APIs, databases, SQL", ref: ["iima", 139], what: "Clients talk to servers over HTTP through APIs; servers read and write databases. Learn SELECT, WHERE, GROUP BY, JOIN and window functions (ROW_NUMBER, RANK)." },
    { id: "c-llm", name: "LLMs, RAG, agents", ref: ["iima", 115], what: "Prompts, retrieval over your own data (RAG), fine-tuning, tool use and agents. Limits: hallucination, cost per task, latency, privacy." },
    { id: "c-evals", name: "AI guardrails, human-in-the-loop, cost per task", ref: ["iima", 59], what: "Eval sets, launch thresholds, fallbacks when the model is wrong, human review where errors are costly, and the cost of each task." }
  ]},
  { g: "Behavioral", items: [
    { id: "c-star", name: "STAR and a story bank", what: "Situation, Task, Action (most of the time, told with 'I'), Result with numbers. Prepare 6 to 8 stories and map each to themes: leading without authority, conflict, failure, a data decision, ambiguity, customer focus, prioritization, feedback." },
    { id: "c-why", name: "Why PM, why Juspay, why Swiggy", what: "Each needs a real moment and specific knowledge of the company's product. Juspay asks for an SOP upfront, so write it early." }
  ]}
];

const LS_KEY = "productprep-tracker-v2";
try { const s = JSON.parse(localStorage.getItem(LS_KEY) || "null"); if (s) state = Object.assign(state, s); } catch (e) {}
state.rate = state.rate || {};
const TABS = ["plan", "bank", "focus", "cases", "concepts", "sources"];

function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }
let dbRef = null, saveTimer = null, writing = false, dirty = false;
function queueSave() { saveLocal(); if (!dbRef) return; clearTimeout(saveTimer); saveTimer = setTimeout(flush, 700); }
async function flush() {
  if (!dbRef) return;
  if (writing) { dirty = true; return; }
  writing = true; dirty = false; setSync("Saving…");
  try { await dbRef.set(JSON.parse(JSON.stringify(state))); setSync("Saved to your tracker"); }
  catch (e) { setSync(e && e.code === "invalid_argument" ? "Read-only view: progress saves on this device only" : "Couldn't save just now. Progress is kept on this device."); }
  writing = false; if (dirty) flush();
}
function setSync(t) { const el = document.getElementById("sync"); if (el) el.textContent = t; }
(async () => {
  let db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
  if (!db) return;
  dbRef = db.doc("tracker/state");
  let first = true;
  dbRef.onSnapshot(snap => {
    if (snap.metadata.hasPendingWrites) return;
    if (snap.exists) {
      const r = JSON.parse(JSON.stringify(snap.data()));
      const merged = { done: r.done || {}, flag: r.flag || {}, notes: r.notes || {}, rate: r.rate || {}, start: r.start || null };
      if (!snap.metadata.fromCache) first = false;
      if (JSON.stringify(merged) !== JSON.stringify(state)) {
        const a = document.activeElement; if (a && a.classList && a.classList.contains("note")) return;
        state = merged; saveLocal(); render(); if (viewer.open) renderViewerSide();
      }
      setSync("Synced to your tracker");
    } else if (!snap.metadata.fromCache && first) { first = false; queueSave(); }
  }, () => setSync("Sync paused. Progress is kept on this device."));
})();

    <div class="filters">${segChips}</div>
    <div class="filters"><input class="search" id="cbsearch" type="search" placeholder="Search cases: Swiggy, UPI, elderly…" value="${esc(ui.cbSearch)}">
      <select class="sel" id="cbstatus" aria-label="Status">${[["all","All"],["todo","Not attempted"],["done","Attempted"],["weak","Rated 1 to 2 stars"]].map(o => `<option value="${o[0]}" ${ui.cbStatus === o[0] ? "selected" : ""}>${o[1]}</option>`).join("")}</select></div>
    <div class="cbgrid">${list.map(card).join("") || '<p class="srcl">No cases match these filters.</p>'}</div>`;
}

function renderConcepts() {
  return `<div class="section-head"><h2>Concepts &amp; frameworks</h2><p>Tick a concept when you can explain it in under a minute without notes. "Read" opens the matching casebook page.</p></div>
    ${CONCEPTS.map(g => `<h3 class="kicker" style="margin-top:20px">${esc(g.g)}</h3><div class="co-grid">${g.items.map(c => {
      const done = !!state.done[c.id];
      return `<article class="panel" style="${done ? "border-color:var(--good)" : ""}"><div style="display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px">
        <input type="checkbox" class="check" id="cb-${c.id}" data-toggle="${c.id}" ${done ? "checked" : ""} aria-label="I can explain ${esc(c.name)}">
        <div style="min-width:0"><h3 style="font-size:16px"><label for="cb-${c.id}">${esc(c.name)}</label></h3><p>${esc(c.what)}</p>
        ${c.list ? `<ul>${c.list.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
        ${c.ex ? `<p class="srcl">${esc(c.ex)}</p>` : ""}
        ${c.ref ? `<p><button class="icon-btn" data-read="${c.ref[0]}:${c.ref[1]}">Read in ${BOOKS[c.ref[0]].short}, p.${c.ref[1]}</button></p>` : ""}</div></div></article>`;
    }).join("")}</div>`).join("")}`;
}

function renderSources() {
  const used = [...new Set(Q.map(q => q[4]).filter(Boolean))];
  return `<div class="section-head"><h2>Sources and method</h2><p>I searched Glassdoor, Grapevine, Medium and Substack write-ups, LinkedIn posts, Blind, and company-tagged question banks for APM and PM-1 questions, with a separate pass for Juspay and Swiggy. No Reddit threads surfaced for these companies, so none are cited. Direct page fetches were blocked in my research environment, so details come from search-engine extracts of these pages. Questions marked Reported are as specific as the source allowed.</p></div>
    <div class="panel"><ul>${used.map(k => `<li>${srcLink(k)}</li>`).join("")}</ul></div>
    <h3 class="kicker" style="margin-top:20px">Also useful</h3>
    <div class="panel"><ul><li>${srcLink("hpm_rca")}</li><li>${srcLink("ag_ai")}</li><li>Decode and Conquer, Lewis Lin (CIRCLES)</li><li>Cracking the PM Interview, Gayle McDowell and Jackie Bavaro</li></ul></div>`;
}

function render() {
  renderStats();
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === ui.tab)));
  const main = document.getElementById("main");
  const a = document.activeElement, aid = a && a.id, caret = a && (aid === "qsearch" || aid === "cbsearch") ? a.selectionStart : null;
  main.innerHTML = { plan: renderPlan, bank: renderBank, focus: renderFocus, cases: renderCases, concepts: renderConcepts, sources: renderSources }[ui.tab]();
  if (aid && !viewer.open) { const el = document.getElementById(aid); if (el) { el.focus(); if (caret != null && el.setSelectionRange) el.setSelectionRange(caret, caret); } }
}

/* ============ PDF viewer ============ */
const viewer = { open: false, book: null, page: 1, caseId: null, zoom: 1, total: 0, task: null, returnFocus: null };
const docs = {};
let pdfjsPromise = null;
function loadPdfJs() {
  if (!pdfjsPromise) pdfjsPromise = new Promise((res, rej) => {
    const s = document.createElement("script"); s.src = "vendor/pdf.min.js";
    s.onload = () => { try { window.pdfjsLib.GlobalWorkerOptions.workerSrc = "vendor/pdf.worker.min.js"; res(window.pdfjsLib); } catch (e) { rej(e); } };
    s.onerror = () => { pdfjsPromise = null; rej(new Error("pdf.js failed to load")); };
    document.head.appendChild(s);
  });
  return pdfjsPromise;
}
function getDoc(book) { if (!docs[book]) docs[book] = loadPdfJs().then(lib => lib.getDocument(BOOKS[book].file).promise).catch(e => { delete docs[book]; throw e; }); return docs[book]; }
function openViewer(book, page, caseId) {
  Object.assign(viewer, { open: true, book, page, caseId: caseId || null, zoom: 1, total: 0, returnFocus: document.activeElement });
  const c = caseId ? CMAP[caseId] : null;
  const title = c ? c.name : (READING.find(r => r.book === book && r.page === page) || {}).name || BOOKS[book].name;
  document.getElementById("viewerRoot").innerHTML = `<div class="viewer" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="vbar"><div style="min-width:0"><h3>${esc(title)}</h3><div class="sub">${esc(BOOKS[book].name)}${c ? " · " + SEGS[c.seg] + (c.asked ? " · asked at " + esc(c.asked) : "") : ""}</div></div>
      <div class="vctl"><button class="icon-btn" data-v="prev" aria-label="Previous page">‹ Prev</button><span class="pg" id="vpg">p. ${page}</span><button class="icon-btn" data-v="next" aria-label="Next page">Next ›</button>
        <button class="icon-btn" data-v="zout" aria-label="Zoom out">−</button><button class="icon-btn" data-v="zin" aria-label="Zoom in">+</button>
        <a class="icon-btn" id="vopen" href="${BOOKS[book].file}#page=${page}" target="_blank" rel="noopener">Open PDF</a>
        <button class="icon-btn primary" data-v="close" id="vclose">Close</button></div></div>
    <div class="vbody"><div class="canvaswrap" id="cwrap"><div class="vmsg" id="vmsg">Loading the casebook…</div><canvas id="vcanvas" hidden></canvas></div>
      <aside class="vside" id="vside"></aside></div></div>`;
  document.body.style.overflow = "hidden";
  document.getElementById("vclose").focus();
  renderViewerSide(); renderPdfPage();
}
function closeViewer() {
  viewer.open = false; document.getElementById("viewerRoot").innerHTML = ""; document.body.style.overflow = "";
  const y = window.scrollY; render(); window.scrollTo(0, y);
}
function renderViewerSide() {
  const side = document.getElementById("vside"); if (!side) return;
  const id = viewer.caseId;
  if (!id) { side.innerHTML = `<div><div class="kicker">Reading</div><p class="srcl">Use Prev and Next (or the arrow keys) to page through. Close returns you to where you were.</p></div>`; return; }
  const c = CMAP[id], r = state.rate[id] || 0, done = !!state.done[id];
  side.innerHTML = `<div><div class="kicker">The case</div><p style="margin:0">${esc(c.prompt)}</p>
      <p class="srcl">Try it out loud before reading the solution. It starts on p.${c.page}.</p></div>
    <div><div class="kicker">How did you do?</div>
      <div class="rate" role="radiogroup" aria-label="Self rating">${[1,2,3,4,5].map(i => `<button class="${i <= r ? "on" : ""}" data-rate="${i}" role="radio" aria-checked="${i === r}" aria-label="${i} star${i > 1 ? "s" : ""}">★</button>`).join("")}</div>
      <div class="ratehelp">1 lost structure · 3 solid but missed things · 5 interview-ready</div></div>
    <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" class="check" data-toggle="${id}" ${done ? "checked" : ""}> Attempted</label>
    <div><div class="kicker">Notes</div><textarea class="note" id="vnote" data-note="${id}" placeholder="What went well, what you missed, mentor feedback">${esc(state.notes[id] || "")}</textarea></div>`;
}
async function renderPdfPage() {
  const msg = document.getElementById("vmsg"), canvas = document.getElementById("vcanvas"), wrap = document.getElementById("cwrap");
  if (!canvas) return;
  const pg = document.getElementById("vpg"), op = document.getElementById("vopen");
  const want = viewer.page, book = viewer.book;
  if (pg) pg.textContent = `p. ${want}${viewer.total ? " / " + viewer.total : ""}`;
  if (op) op.href = `${BOOKS[book].file}#page=${want}`;
  try {
    const doc = await getDoc(book);
    if (!viewer.open || viewer.book !== book) return;
    viewer.total = doc.numPages;
    viewer.page = Math.min(Math.max(1, viewer.page), doc.numPages);
    if (pg) pg.textContent = `p. ${viewer.page} / ${viewer.total}`;
    const page = await doc.getPage(viewer.page);
    if (viewer.task) { try { viewer.task.cancel(); } catch (e) {} }
    const base = page.getViewport({ scale: 1 });
    const availW = Math.max(260, wrap.clientWidth - 32), availH = Math.max(260, wrap.clientHeight - 32);
    const fit = Math.min(availW / base.width, availH / base.height);
    const scale = Math.max(fit, availW / base.width * 0.6) * viewer.zoom, dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const vp = page.getViewport({ scale: scale * dpr });
    canvas.width = Math.floor(vp.width); canvas.height = Math.floor(vp.height);
    canvas.style.width = Math.floor(vp.width / dpr) + "px"; canvas.style.height = Math.floor(vp.height / dpr) + "px";
    viewer.task = page.render({ canvasContext: canvas.getContext("2d"), viewport: vp });
    await viewer.task.promise;
    msg.hidden = true; canvas.hidden = false; wrap.scrollTop = 0;
  } catch (e) {
    if (e && e.name === "RenderingCancelledException") return;
    if (!document.getElementById("vmsg")) return;
    msg.hidden = false; canvas.hidden = true;
    msg.innerHTML = `The page viewer couldn't load here. Use <a href="${BOOKS[viewer.book].file}#page=${viewer.page}" target="_blank" rel="noopener">Open PDF</a> to read page ${viewer.page} in a new tab. Rating and notes still work.`;
  }
}

/* ============ Events ============ */
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.toggle) { const id = t.dataset.toggle; if (t.checked) state.done[id] = true; else delete state.done[id]; queueSave(); if (viewer.open) renderStats(); else render(); }
  else if (t.id === "startDate") { state.start = t.value || null; ui.openDays = null; queueSave(); render(); }
  else if (t.id === "qstatus") { ui.status = t.value; render(); }
  else if (t.id === "qco") { ui.co = t.value; render(); }
  else if (t.id === "cbstatus") { ui.cbStatus = t.value; render(); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset && t.dataset.note) { const id = t.dataset.note; if (t.value.trim()) state.notes[id] = t.value; else delete state.notes[id]; queueSave(); }
  else if (t.id === "qsearch") { ui.search = t.value; render(); }
  else if (t.id === "cbsearch") { ui.cbSearch = t.value; render(); }
});
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const d = b.dataset;
  if (d.tab) { ui.tab = d.tab; try { history.replaceState(null, "", "#" + ui.tab); } catch (err) {} render(); window.scrollTo({ top: 0 }); }
  else if (d.flag) { if (state.flag[d.flag]) delete state.flag[d.flag]; else state.flag[d.flag] = true; queueSave(); render(); }
  else if (d.expand) { ui.open.has(d.expand) ? ui.open.delete(d.expand) : ui.open.add(d.expand); render(); const n = document.getElementById("note-" + d.expand); if (n) n.focus(); }
  else if (d.type) { ui.type = d.type; render(); }
  else if (d.focus) { ui.focusCo = d.focus; render(); }
  else if (d.cbbook) { ui.cbBook = d.cbbook; render(); }
  else if (d.cbseg) { ui.cbSeg = d.cbseg; render(); }
  else if (d.case) { const c = CMAP[d.case]; openViewer(c.book, c.page, c.id); }
  else if (d.read) { const [bk, p] = d.read.split(":"); openViewer(bk, +p, null); }
  else if (d.rate) { const id = viewer.caseId, v = +d.rate; if (!id) return; if (state.rate[id] === v) delete state.rate[id]; else { state.rate[id] = v; state.done[id] = true; } queueSave(); renderViewerSide(); renderStats(); }
  else if (d.v) {
    if (d.v === "close") closeViewer();
    else if (d.v === "prev") { viewer.page = Math.max(1, viewer.page - 1); renderPdfPage(); }
    else if (d.v === "next") { viewer.page = viewer.total ? Math.min(viewer.total, viewer.page + 1) : viewer.page + 1; renderPdfPage(); }
    else if (d.v === "zin") { viewer.zoom = Math.min(3, viewer.zoom + 0.25); renderPdfPage(); }
    else if (d.v === "zout") { viewer.zoom = Math.max(0.5, viewer.zoom - 0.25); renderPdfPage(); }
  }
});
document.addEventListener("keydown", e => {
  if (!viewer.open || (e.target && /TEXTAREA|INPUT/.test(e.target.tagName))) return;
  if (e.key === "Escape") closeViewer();
  else if (e.key === "ArrowRight") { viewer.page = viewer.total ? Math.min(viewer.total, viewer.page + 1) : viewer.page + 1; renderPdfPage(); }
  else if (e.key === "ArrowLeft") { viewer.page = Math.max(1, viewer.page - 1); renderPdfPage(); }
});
document.addEventListener("toggle", e => { const d = e.target; if (!d.dataset || !d.dataset.day || !ui.openDays) return; if (d.open) ui.openDays.add(d.dataset.day); else ui.openDays.delete(d.dataset.day); }, true);
let rsz; window.addEventListener("resize", () => { if (!viewer.open) return; clearTimeout(rsz); rsz = setTimeout(renderPdfPage, 200); });

render();
</script>
